<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>에스씨지랩</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg:#F8FAFC; --bg2:#FFFFFF; --bg3:#F1F5F9;
  --border:#E2E8F0; --border2:#CBD5E1;
  --text:#1E293B; --text2:#475569; --text3:#94A3B8;
  --blue:#2563EB; --blue-dim:#EFF6FF;
  --green:#059669; --green-dim:#ECFDF5;
  --amber:#D97706; --amber-dim:#FFFBEB;
  --red:#DC2626; --red-dim:#FEF2F2;
  --purple:#7C3AED;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard',sans-serif;font-size:14px;line-height:1.6;min-height:100vh;;letter-spacing:-.2px}

/* Header */
.header{background:#0F172A;padding:20px 40px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:14px;}
.header-logo{width:36px;height:36px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;text-decoration:none;transition:transform .15s,box-shadow .15s;}
.header-logo:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.4);}
.header-left h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.4px;}
.header-left p{font-size:11px;color:#64748B;font-family:'Pretendard',sans-serif;margin-top:2px;}
.header-right{display:flex;gap:10px;align-items:center;}
.badge{font-size:11px;font-family:'Pretendard',sans-serif;background:var(--blue-dim);color:var(--blue);border:1px solid rgba(37,99,235,.15);border-radius:20px;padding:3px 12px;}
.back-btn{font-size:12px;font-weight:500;background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;cursor:pointer;text-decoration:none;transition:background .15s;}
.back-btn:hover{background:var(--border);}
.ai-btn{font-size:12px;font-weight:600;background:#2563EB;color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;text-decoration:none;transition:background .15s;}
.ai-btn:hover{background:#1D4ED8;}

/* Tabs */
.tab-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 40px;position:sticky;top:0;z-index:10;display:flex;gap:0;}
.tab{font-size:13px;font-weight:400;padding:14px 22px;cursor:pointer;color:var(--text3);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;font-family:'Pretendard',sans-serif;white-space:nowrap;}
.tab:hover{color:var(--text2);}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600;}

/* Layout */
.main{padding:28px 40px 48px;max-width:1180px;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
.cash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:8px;}
.cash-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px 20px;position:relative;overflow:hidden;}
.cash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#2563EB;}
.cash-card:nth-child(2)::before{background:#059669;}
.cash-card:nth-child(3)::before{background:#D97706;}
.cash-card:nth-child(4)::before{background:#7C3AED;}
.cash-label{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:8px;}
.cash-value{font-size:26px;font-weight:800;color:var(--text);font-family:'Pretendard',sans-serif;letter-spacing:-1px;}
.cash-value span{font-size:13px;font-weight:400;color:var(--text3);margin-left:3px;}
.cash-sub{font-size:11px;color:var(--text3);margin-top:6px;}
@media(max-width:700px){.cash-grid{grid-template-columns:repeat(2,1fr);}}
.kpi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);}
.kpi-label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.kpi-value{font-size:24px;font-weight:700;color:var(--text);font-family:'Pretendard',sans-serif;letter-spacing:-1px;}
.kpi-value span{font-size:13px;font-weight:400;color:var(--text3);margin-left:3px;}
.kpi-sub{font-size:12px;color:var(--text3);margin-top:4px;}
.kpi-badge{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;font-family:'Pretendard',sans-serif;}
.up{background:var(--green-dim);color:var(--green);}
.down{background:var(--red-dim);color:var(--red);}
.flat{background:var(--amber-dim);color:var(--amber);}

/* Cards */
.chart-grid{display:grid;gap:16px;}
.chart-grid-2{grid-template-columns:1fr 1fr;}
.chart-grid-1{grid-template-columns:1fr;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;box-shadow:var(--shadow);}
.card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px;}
.card-sub{font-size:11px;color:var(--text3);margin-bottom:16px;}
.chart-wrap{position:relative;height:240px;}

/* Table */
.fin-table{width:100%;border-collapse:collapse;font-size:14px;}
.fin-table th{background:var(--bg3);color:var(--text);font-weight:700;padding:12px 16px;text-align:right;border-bottom:2px solid var(--border2);font-family:'Pretendard',sans-serif;font-size:13px;}
.fin-table th:first-child{text-align:left;}
.fin-table td{padding:11px 16px;text-align:right;border-bottom:1px solid var(--border);color:var(--text);font-weight:500;font-family:'Pretendard',sans-serif;font-size:14px;}
.fin-table td:first-child{text-align:left;color:var(--text);font-weight:600;font-family:'Pretendard',sans-serif;}
.fin-table tr:hover td{background:var(--bg3);}
.fin-table .section-row td{background:#EFF2F7;color:var(--text);font-weight:700;font-size:14px;}
.fin-table .highlight-row td{color:var(--blue);font-weight:800;background:#F5F8FF;font-size:14px;}
.fin-table .neg{color:var(--red)!important;}
.fin-table .pos-g{color:var(--green)!important;}
.fin-table .term{display:block;font-size:11px;color:var(--text2);margin-top:2px;font-weight:500;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}

/* Tooltip */
.tip{cursor:help;border-bottom:1px dashed var(--text3);}
#tooltip{
  position:fixed;
  background:#1E293B;
  color:#fff;
  font-size:12px;
  font-family:'Pretendard',sans-serif;
  line-height:1.7;
  padding:10px 14px;
  border-radius:8px;
  max-width:260px;
  pointer-events:none;
  opacity:0;
  transition:opacity .15s;
  z-index:9999;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
  white-space:normal;
}
#tooltip.show{opacity:1;}
#tooltip .tip-formula{color:#93C5FD;font-size:11px;margin-bottom:4px;font-family:'Pretendard',sans-serif;}
#tooltip .tip-desc{color:#fff;}
#tooltip .tip-note{color:#94A3B8;font-size:11px;margin-top:3px;}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.legend-line{width:18px;height:2px;flex-shrink:0;}
.sec-title{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);}

@media(max-width:900px){
  .header,.tab-bar,.main{padding-left:20px;padding-right:20px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .chart-grid-2{grid-template-columns:1fr;}
}

/* ── 2026 진행/전망 컬럼 (확정치 아님을 시각적으로 구분) */
.fin-table th.col-fcst, .fin-table td.col-fcst{
  background:repeating-linear-gradient(45deg,rgba(148,163,184,.055) 0 6px,transparent 6px 12px);
  color:#94A3B8; font-style:italic;
  border-left:2px dashed #CBD5E1;
}
.fin-table th.col-fcst{ color:#94A3B8; font-style:normal; font-weight:600; }
.fin-table th.col-act26, .fin-table td.col-act26{
  background:rgba(59,130,246,.045);
  border-left:2px solid #BFDBFE;
}
.fin-table td.col-fcst.pos-g, .fin-table td.col-fcst.neg{ opacity:.75; }
.col-tag{ display:block; font-size:9px; font-weight:400; letter-spacing:.2px; margin-top:2px; opacity:.85; }
.fcst-note{
  background:#F8FAFC; border:1px dashed #CBD5E1; border-radius:8px;
  padding:9px 13px; margin-top:10px; font-size:11.5px; color:#64748B; line-height:1.65;
}
</style>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style id="lock-css">
#lockbox{position:fixed;inset:0;background:#0F172A;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif}
#lockbox .lock-card{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
#lockbox .lock-ico{width:48px;height:48px;background:#2563EB;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 16px}
#lockbox .lock-t{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;color:#1a1d23}
#lockbox .lock-s{font-size:12px;color:#9499ab;line-height:1.7;margin-bottom:24px}
#lockbox .lock-in{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;border:1.5px solid #d1d5db;border-radius:10px;outline:none;text-align:center;letter-spacing:2px}
#lockbox .lock-in:focus{border-color:#4b7cf3;box-shadow:0 0 0 3px rgba(75,124,243,.12)}
#lockbox .lock-btn{width:100%;margin-top:10px;padding:12px;font-size:13.5px;font-weight:700;font-family:inherit;background:#2563EB;color:#fff;border:0;border-radius:10px;cursor:pointer}
#lockbox .lock-btn:hover{background:#1d4ed8}
#lockbox .lock-btn:disabled{opacity:.6;cursor:wait}
#lockbox .lock-err{font-size:11.5px;color:#ef4444;margin-top:12px;min-height:16px;font-weight:600}
#lockbox .lock-note{font-size:10px;color:#b0b5c2;line-height:1.7;margin-top:22px;padding-top:16px;border-top:1px solid #e8eaed}
</style>
</head>
<body>
<div id="lockbox">
  <div class="lock-card">
    <div class="lock-ico">🔒</div>
    <div class="lock-t">재무제표</div>
    <div class="lock-s">대외비 재무자료입니다.<br>비밀번호를 입력해 주세요.</div>
    <input type="password" id="lock-pw" class="lock-in" placeholder="비밀번호" autocomplete="off" autofocus>
    <button class="lock-btn" id="lock-go">열람하기</button>
    <div class="lock-err" id="lock-err"></div>
    <div class="lock-note">본 페이지의 정보는 대외비입니다.<br>무단 열람·복제·외부 반출을 금합니다.</div>
  </div>
</div>

<script>
(function(){
  const B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const P=JSON.parse(document.getElementById('sealed').textContent);
  const box=document.getElementById('lockbox'), vault=document.getElementById('vault');
  const inp=document.getElementById('lock-pw'), btn=document.getElementById('lock-go'), err=document.getElementById('lock-err');
  let busy=false;

  async function unseal(pw){
    const ks=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:B(P.s),iterations:P.n,hash:'SHA-256'},ks,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(P.i)},key,B(P.c));
    return new TextDecoder().decode(pt);
  }

  function open_(html){
    vault.innerHTML=html;
    // 봉인 해제 후 내부 <script> 재실행 (innerHTML은 스크립트를 실행하지 않음)
    vault.querySelectorAll('script').forEach(function(old){
      const s=document.createElement('script');
      for(const a of old.attributes) s.setAttribute(a.name,a.value);
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
    box.remove();
    document.getElementById('sealed').remove();
    document.getElementById('lock-css').remove();
  }

  async function tryPw(pw,silent){
    if(busy||!pw) return false;
    busy=true; btn.textContent='해독 중…'; btn.disabled=true; err.textContent='';
    try{
      const html=await unseal(pw);
      sessionStorage.setItem('scg_k',pw);
      open_(html); return true;
    }catch(e){
      sessionStorage.removeItem('scg_k');
      if(!silent){ err.textContent='비밀번호가 올바르지 않습니다.'; inp.value=''; inp.focus(); }
      btn.textContent='열람하기'; btn.disabled=false; busy=false; return false;
    }
  }

  btn.onclick=()=>tryPw(inp.value,false);
  inp.onkeydown=e=>{ if(e.key==='Enter') tryPw(inp.value,false); };

  // 세션에 저장된 비번으로 자동 해제 (페이지 이동 시 재입력 불필요)
  const saved=sessionStorage.getItem('scg_k');
  if(saved) tryPw(saved,true).then(ok=>{ if(!ok){ btn.textContent='열람하기'; btn.disabled=false; busy=false; inp.focus(); } });
})();
</script>
</body>
</html>
