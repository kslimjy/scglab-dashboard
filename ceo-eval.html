<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>에스씨지랩</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F8FAFC;--bg2:#FFFFFF;--bg3:#F1F5F9;--border:#E2E8F0;
  --text:#1E293B;--text2:#475569;--text3:#94A3B8;
  --blue:#2563EB;--blue-dim:#EFF6FF;--green:#059669;--green-dim:#ECFDF5;
  --amber:#D97706;--amber-dim:#FFFBEB;--red:#DC2626;--red-dim:#FEF2F2;
  --purple:#7C3AED;--purple-dim:#F5F3FF;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard',sans-serif;font-size:14px;line-height:1.6;}
.header{background:#0F172A;padding:18px 40px;display:flex;align-items:center;justify-content:space-between;}
.header-left{display:flex;align-items:center;gap:12px;}
.logo{width:34px;height:34px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;text-decoration:none;transition:transform .15s,box-shadow .15s;}
.logo:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.4);}
.header-left h1{font-size:17px;font-weight:800;color:#fff;}
.header-left p{font-size:11px;color:#64748B;font-family:'Pretendard',sans-serif;margin-top:1px;}
.header-right{display:flex;gap:8px;align-items:center;}
.trial-badge{font-size:11px;font-weight:700;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A;border-radius:6px;padding:4px 10px;}
.back-btn{font-size:12px;font-weight:500;background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;text-decoration:none;}
.main{padding:24px 40px 60px;max-width:1320px;margin:0 auto;}
.trial-notice{background:#FFFBEB;border:1px solid #FDE68A;border-radius:var(--radius);padding:12px 18px;margin-bottom:20px;font-size:12px;color:#92400E;}
.page-grid{display:grid;grid-template-columns:410px 1fr;gap:20px;align-items:start;}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.panel-hdr{padding:12px 18px;border-bottom:1px solid var(--border);}
.panel-hdr h2{font-size:13px;font-weight:700;}
.panel-hdr p{font-size:11px;color:var(--text3);margin-top:1px;}
.panel-hdr.purple{background:var(--purple);color:#fff;}
.panel-hdr.purple p{color:rgba(255,255,255,.7);}
.panel-hdr.amber{background:#D97706;color:#fff;}
.panel-hdr.amber p{color:rgba(255,255,255,.7);}
.panel-hdr.gray{background:var(--bg3);}
.panel-body{padding:18px;}
.ig{margin-bottom:14px;}
.il{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.ih{font-size:10px;color:var(--text3);font-weight:400;}
.irow{display:flex;gap:6px;align-items:center;}
input[type=number],input[type=text]{flex:1;padding:8px 11px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:'Pretendard',sans-serif;color:var(--text);background:var(--bg);outline:none;transition:border-color .15s;}
input:focus{border-color:var(--purple);}
input.highlight-input{border-color:var(--amber);background:#FFFEF8;}
.iu{font-size:11px;color:var(--text3);white-space:nowrap;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.pei-row{display:flex;gap:7px;}
.pei-btn{flex:1;padding:9px 0;border:2px solid var(--border);border-radius:8px;background:var(--bg);cursor:pointer;font-size:13px;font-weight:700;color:var(--text3);transition:all .15s;font-family:'Pretendard',sans-serif;text-align:center;}
.pei-btn.sel-A{border-color:var(--green);color:var(--green);background:var(--green-dim);}
.pei-btn.sel-B{border-color:var(--blue);color:var(--blue);background:var(--blue-dim);}
.pei-btn.sel-C{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.calc-btn{width:100%;padding:11px;background:var(--purple);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px;font-family:'Pretendard',sans-serif;}
.calc-btn:hover{background:#6D28D9;}

/* ===== K-ROE ===== */
.kroe-ctl{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px;}
.kroe-ctl .fld{display:flex;flex-direction:column;gap:4px;}
.kroe-ctl label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.02em;}
.kroe-ctl select{padding:7px 10px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-family:'Pretendard',sans-serif;color:var(--text);background:var(--bg2);outline:none;min-width:92px;cursor:pointer;}
.kroe-ctl select:focus{border-color:var(--blue);}
.kroe-note{font-size:10px;color:var(--text3);margin-left:auto;text-align:right;line-height:1.45;}
.kroe-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.kroe-card{border:1px solid var(--border);border-radius:9px;overflow:hidden;background:var(--bg2);}
.kroe-card .kh{padding:7px 10px;font-size:11px;font-weight:700;color:#fff;text-align:center;background:#1E3A5F;}
.kroe-card.plan .kh{background:#475569;}
.kroe-card.cum  .kh{background:#1D4ED8;}
.kroe-card.mon  .kh{background:#0F766E;}
.kroe-card .kv{padding:12px 8px 4px;text-align:center;font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.kroe-card .ks{padding:0 8px 10px;text-align:center;font-size:10px;color:var(--text3);}
.kroe-chart{border:1px solid var(--border);border-radius:9px;padding:10px 12px 6px;background:var(--bg2);margin-bottom:14px;height:230px;position:relative;}
.kroe-tabs{display:flex;gap:6px;margin-bottom:10px;}
.kroe-tab{padding:6px 13px;border:1.5px solid var(--border);border-radius:7px;background:var(--bg2);cursor:pointer;font-size:11px;font-weight:700;color:var(--text3);font-family:'Pretendard',sans-serif;transition:all .15s;}
.kroe-tab.on{border-color:var(--blue);color:var(--blue);background:var(--blue-dim);}
table.kroe-t{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums;}
table.kroe-t th,table.kroe-t td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;}
table.kroe-t th{background:var(--bg3);font-size:10px;font-weight:700;color:var(--text2);text-align:right;}
table.kroe-t th:first-child,table.kroe-t td:first-child{text-align:left;font-weight:600;color:var(--text2);}
table.kroe-t tr.roe-row td{font-weight:800;color:var(--text);background:#F8FAFF;}
table.kroe-t tr.roe-row td:first-child{color:var(--blue);}
table.kroe-t td.dim{color:var(--text3);}
.kroe-legend{font-size:10px;color:var(--text3);margin-top:8px;line-height:1.6;}
.kroe-legend b{color:var(--text2);}
@media(max-width:900px){.kroe-cards{grid-template-columns:1fr;}}
.spi2-box{background:var(--amber-dim);border:1px solid #FDE68A;border-radius:8px;padding:12px 14px;margin-top:10px;}
.spi2-box-title{font-size:11px;font-weight:700;color:var(--amber);margin-bottom:8px;}
.spi2-line{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;font-family:'Pretendard',sans-serif;}
.spi2-line.total{border-top:1px solid #FDE68A;margin-top:4px;padding-top:6px;font-weight:700;color:var(--amber);}
.result-big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.rbox{border-radius:10px;padding:16px;text-align:center;}
.rbox.bonus{background:var(--purple-dim);border:1px solid rgba(124,58,237,.15);}
.rbox.salary{background:var(--blue-dim);border:1px solid rgba(37,99,235,.15);}
.rbox-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.rbox-val{font-size:24px;font-weight:700;font-family:'Pretendard',sans-serif;letter-spacing:-1px;}
.rbox.bonus .rbox-val{color:var(--purple);}
.rbox.salary .rbox-val{color:var(--blue);}
.rbox-sub{font-size:10px;color:var(--text3);margin-top:3px;}
.ct{width:100%;border-collapse:collapse;font-size:12px;}
.ct tr{border-bottom:1px solid var(--border);}
.ct tr:last-child{border-bottom:none;}
.ct td{padding:7px 10px;}
.ct td:first-child{color:var(--text3);}
.ct td:last-child{text-align:right;font-family:'Pretendard',sans-serif;font-weight:600;}
.ct .sh td{background:var(--bg3);font-weight:700;font-family:'Pretendard',sans-serif;color:var(--text);}
.ct .hl td{color:var(--purple);}
.ct .hlb td{color:var(--blue);}
.warn{background:var(--red-dim);border:1px solid rgba(220,38,38,.2);border-radius:7px;padding:9px 13px;font-size:11px;color:var(--red);margin-bottom:12px;display:none;}
.ref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.ref-item{background:var(--bg3);border-radius:7px;padding:10px 12px;}
.ref-label{font-size:10px;color:var(--text3);}
.ref-val{font-size:14px;font-weight:700;font-family:'Pretendard',sans-serif;}
.esi-t{width:100%;border-collapse:collapse;font-size:11px;margin-top:6px;}
.esi-t th,.esi-t td{padding:5px 7px;border:1px solid var(--border);}
.esi-t th{background:var(--bg3);font-weight:600;text-align:center;}
.esi-t td{text-align:center;font-family:'Pretendard',sans-serif;}
.esi-t .ar td{background:var(--amber-dim);color:var(--amber);font-weight:700;}
.spi2-ref{margin-top:14px;background:var(--bg3);border-radius:8px;padding:12px 14px;}
.spi2-ref-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;display:flex;justify-content:space-between;}
.spi2-ref-title span{color:var(--text3);font-weight:400;font-family:'Pretendard',sans-serif;}
.spi2-ref-table{width:100%;border-collapse:collapse;font-size:11px;}
.spi2-ref-table th{background:var(--bg2);padding:5px 8px;border:1px solid var(--border);font-weight:600;text-align:center;}
.spi2-ref-table th:first-child{text-align:left;}
.spi2-ref-table td{padding:5px 8px;border:1px solid var(--border);text-align:right;font-family:'Pretendard',sans-serif;}
.spi2-ref-table td:first-child{text-align:left;font-family:'Pretendard',sans-serif;color:var(--text2);}
.spi2-ref-table tr.sub td{background:#FEF9F0;font-weight:600;}
.spi2-ref-table tr.tot td{background:var(--amber-dim);color:var(--amber);font-weight:700;}
.spi2-ref-note{font-size:10px;color:var(--text3);margin-top:6px;line-height:1.5;}
.val-good{color:var(--blue)!important;font-weight:700!important;}
.val-bad{color:var(--red)!important;font-weight:700!important;}
.reason-box{background:var(--red-dim);border-left:3px solid var(--red);border-radius:0 6px 6px 0;padding:7px 11px;margin:2px 0 4px;font-size:11px;color:var(--red);line-height:1.6;}
.reason-box strong{font-weight:700;}
.reason-box.info{background:var(--blue-dim);border-left-color:var(--blue);color:var(--blue);}



.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.fitem{background:var(--bg3);border-radius:7px;padding:11px 13px;}
.fitem-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:3px;}
.fitem-code{font-size:11px;font-family:'Pretendard',sans-serif;color:var(--blue);background:var(--blue-dim);border-radius:4px;padding:3px 7px;margin-bottom:3px;line-height:1.5;}
.fitem-note{font-size:10px;color:var(--text3);line-height:1.5;}
@media(max-width:1000px){.page-grid{grid-template-columns:1fr;}.fgrid{grid-template-columns:1fr;}.ref-grid{grid-template-columns:repeat(2,1fr);}}
/* ── 페이지 탭 네비 ── */
.page-tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:22px;}
.page-tab{padding:9px 22px;font-size:13px;font-weight:700;color:var(--text3);cursor:pointer;border:none;background:none;font-family:'Pretendard',sans-serif;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:color .15s,border-color .15s;}
.page-tab:hover{color:var(--text2);}
.page-tab.on{color:var(--blue);border-bottom-color:var(--blue);}
.tab-pane{display:none;}
.tab-pane.on{display:block;}

/* ── 10년 추이 탭 ── */
.proj-notice{background:#EFF6FF;border:1px solid #BFDBFE;border-radius:var(--radius);padding:12px 18px;margin-bottom:18px;font-size:12px;color:#1D4ED8;line-height:1.7;}
.proj-notice strong{font-weight:700;}
.proj-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;}
.proj-ibox{background:var(--bg2);border:1.5px solid var(--border);border-radius:9px;padding:14px 16px;}
.proj-ibox label{font-size:11px;font-weight:700;color:var(--text2);display:block;margin-bottom:6px;}
.proj-ibox .sub-label{font-size:10px;color:var(--text3);margin-bottom:5px;display:block;}
.proj-ibox input[type=text],.proj-ibox input[type=number]{width:100%;border:1.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:'Pretendard',sans-serif;background:var(--bg3);color:var(--text);outline:none;}
.proj-ibox input:focus{border-color:var(--blue);background:#fff;}
.proj-ibox .unit{font-size:11px;color:var(--text3);margin-left:4px;}
.proj-pei-row{display:flex;gap:6px;margin-top:4px;}
.proj-pei-btn{flex:1;padding:7px 0;border:1.5px solid var(--border);border-radius:6px;background:var(--bg3);cursor:pointer;font-size:12px;font-weight:700;color:var(--text3);font-family:'Pretendard',sans-serif;transition:all .15s;}
.proj-pei-btn.sel{border-color:var(--green);color:var(--green);background:var(--green-dim);}
.proj-calc-btn{display:block;width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:800;font-family:'Pretendard',sans-serif;cursor:pointer;margin-bottom:22px;transition:background .15s;}
.proj-calc-btn:hover{background:#1D4ED8;}
.proj-section-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:10px;padding-bottom:6px;border-bottom:1.5px solid var(--border);}
.proj-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px;}
@media(max-width:900px){.proj-grid{grid-template-columns:1fr;}}
.proj-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;overflow:hidden;}
.proj-card-hdr{padding:10px 14px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px;}
.proj-card-hdr.blue{background:var(--blue-dim);color:var(--blue);}
.proj-card-hdr.amber{background:var(--amber-dim);color:#92400E;}
.proj-card-body{padding:0 0 4px;}
table.proj-t{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums;}
table.proj-t th{background:var(--bg3);padding:6px 10px;text-align:right;font-size:10.5px;font-weight:700;color:var(--text2);border-bottom:1px solid var(--border);}
table.proj-t th:first-child{text-align:left;}
table.proj-t td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--border);color:var(--text2);}
table.proj-t td:first-child{text-align:left;font-weight:700;color:var(--text);}
table.proj-t tr:last-child td{border-bottom:none;}
table.proj-t tr.proj-hl td{background:#F8FAFF;font-weight:800;color:var(--blue);}
table.proj-t tr.proj-hl td:first-child{color:var(--blue);}
table.proj-t .cap-tag{font-size:9.5px;background:var(--amber-dim);color:var(--amber);border-radius:3px;padding:1px 4px;margin-left:4px;font-weight:700;}
table.proj-t th:last-child,table.proj-t td:last-child{width:36px;padding:4px 6px;text-align:center;}
.proj-chart-wrap{background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:16px;margin-bottom:18px;}
.proj-chart-wrap h3{font-size:12px;font-weight:800;color:var(--text);margin-bottom:12px;}
.proj-chart-inner{height:260px;position:relative;}
.proj-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:20px;}
.proj-sum-box{background:var(--bg2);border:1.5px solid var(--border);border-radius:9px;padding:12px 14px;text-align:center;}
.proj-sum-box .s-label{font-size:10px;color:var(--text3);font-weight:600;margin-bottom:2px;}
.proj-sum-box .s-val{font-size:18px;font-weight:800;color:var(--text);line-height:1.2;}
.proj-sum-box .s-sub{font-size:10px;color:var(--text3);margin-top:2px;}
.proj-sum-box.blue{border-color:#BFDBFE;background:var(--blue-dim);}
.proj-sum-box.blue .s-val{color:var(--blue);}
.proj-sum-box.amber{border-color:#FDE68A;background:var(--amber-dim);}
.proj-sum-box.amber .s-val{color:#92400E;}
.proj-sum-box.green{border-color:#A7F3D0;background:var(--green-dim);}
.proj-sum-box.green .s-val{color:var(--green);}
.proj-assumption-box{background:var(--bg3);border-radius:8px;padding:12px 14px;font-size:11px;color:var(--text3);line-height:1.8;margin-bottom:8px;}
.proj-assumption-box strong{color:var(--text2);font-weight:700;}
.proj-edit-cell{cursor:text;border-bottom:1.5px dashed var(--blue);transition:background .1s;}
.proj-edit-cell:hover{background:var(--blue-dim)!important;}
.proj-edit-cell:focus{outline:none;background:#EFF6FF!important;border-bottom-color:#1D4ED8;}

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style id="lock-css">
#lockbox{position:fixed;inset:0;background:#0F172A;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif}
#lockbox .lock-card{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
#lockbox .lock-ico{width:48px;height:48px;background:#2563EB;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 16px}
#lockbox .lock-t{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;color:#1a1d23}
#lockbox .lock-s{font-size:12px;color:#9499ab;line-height:1.7;margin-bottom:24px}
#lockbox .lock-in{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;border:1.5px solid #d1d5db;border-radius:10px;outline:none;text-align:center;letter-spacing:2px}
#lockbox .lock-in:focus{border-color:#4b7cf3;box-shadow:0 0 0 3px rgba(75,124,243,.12)}
#lockbox .lock-btn{width:100%;margin-top:10px;padding:12px;font-size:13.5px;font-weight:700;font-family:inherit;background:#2563EB;color:#fff;border:0;border-radius:10px;cursor:pointer}
#lockbox .lock-btn:hover{background:#1d4ed8}
#lockbox .lock-btn:disabled{opacity:.6;cursor:wait}
#lockbox .lock-err{font-size:11.5px;color:#ef4444;margin-top:12px;min-height:16px;font-weight:600}
#lockbox .lock-note{font-size:10px;color:#b0b5c2;line-height:1.7;margin-top:22px;padding-top:16px;border-top:1px solid #e8eaed}
</style>
</head>
<body>
<div id="lockbox">
  <div class="lock-card">
    <div class="lock-ico">🔒</div>
    <div class="lock-t">CEO 평가</div>
    <div class="lock-s">열람 권한이 있는 담당자만 접근할 수 있습니다.<br>비밀번호를 입력해 주세요.</div>
    <input type="password" id="lock-pw" class="lock-in" placeholder="비밀번호" autocomplete="off" autofocus>
    <button class="lock-btn" id="lock-go">열람하기</button>
    <div class="lock-err" id="lock-err"></div>
    <div class="lock-note">본 페이지의 정보는 대외비입니다.<br>무단 열람·복제·외부 반출을 금합니다.</div>
  </div>

<script>
(function(){
  const B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const P=JSON.parse(document.getElementById('sealed').textContent);
  const box=document.getElementById('lockbox'), vault=document.getElementById('vault');
  const inp=document.getElementById('lock-pw'), btn=document.getElementById('lock-go'), err=document.getElementById('lock-err');
  let busy=false;

  async function unseal(pw){
    const ks=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:B(P.s),iterations:P.n,hash:'SHA-256'},ks,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(P.i)},key,B(P.c));
    return new TextDecoder().decode(pt);
  }

  function open_(html){
    vault.innerHTML=html;
    // 봉인 해제 후 내부 <script> 재실행 (innerHTML은 스크립트를 실행하지 않음)
    vault.querySelectorAll('script').forEach(function(old){
      const s=document.createElement('script');
      for(const a of old.attributes) s.setAttribute(a.name,a.value);
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
    box.remove();
    document.getElementById('sealed').remove();
    document.getElementById('lock-css').remove();
  }

  async function tryPw(pw,silent){
    if(busy||!pw) return false;
    busy=true; btn.textContent='해독 중…'; btn.disabled=true; err.textContent='';
    try{
      const html=await unseal(pw);
      sessionStorage.setItem('scg_k',pw);
      open_(html); return true;
    }catch(e){
      sessionStorage.removeItem('scg_k');
      if(!silent){ err.textContent='비밀번호가 올바르지 않습니다.'; inp.value=''; inp.focus(); }
      btn.textContent='열람하기'; btn.disabled=false; busy=false; return false;
    }
  }

  btn.onclick=()=>tryPw(inp.value,false);
  inp.onkeydown=e=>{ if(e.key==='Enter') tryPw(inp.value,false); };

  // 세션에 저장된 비번으로 자동 해제 (페이지 이동 시 재입력 불필요)
  const saved=sessionStorage.getItem('scg_k');
  if(saved) tryPw(saved,true).then(ok=>{ if(!ok){ btn.textContent='열람하기'; btn.disabled=false; busy=false; inp.focus(); } });
})();
</script>
</body>
</html>
