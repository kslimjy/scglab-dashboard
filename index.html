<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>에스씨지랩</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #F8FAFC;
  font-family: 'Pretendard', sans-serif;
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* ── Header */
.header {
  background: #0F172A;
  padding: 22px 48px;
  display: flex; align-items: center; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #2563EB, #1D4ED8);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: white; font-weight: 800;
  box-shadow: 0 2px 8px rgba(37,99,235,.25);
}
.brand-text h1 { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -.6px; }
.brand-text p  { font-size: 12px; color: #64748B; font-family: 'Pretendard', sans-serif; margin-top: 2px; }
.header-meta { font-size: 11px; color: #64748B; font-family: 'Pretendard', sans-serif; }

/* ── Hero */
.hero {
  background: linear-gradient(160deg, #EFF6FF 0%, #F8FAFC 60%);
  border-bottom: 1px solid #E2E8F0;
  padding: 52px 48px 44px;

}
.hero h2 { font-size: 32px; font-weight: 800; color: #0F172A; letter-spacing: -1px; line-height: 1.25; }
.hero p  { font-size: 15px; color: #64748B; margin-top: 12px; line-height: 1.7; max-width: 520px; letter-spacing: -.2px; }
.hero-badges { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.hero-badge {
  font-size: 11px; font-family: 'Pretendard', sans-serif;
  padding: 4px 12px; border-radius: 20px; font-weight: 500;
}
.b-blue   { background: #EFF6FF; color: #2563EB; border: 1px solid rgba(37,99,235,.15); }
.b-green  { background: #ECFDF5; color: #059669; border: 1px solid rgba(5,150,105,.15); }
.b-amber  { background: #FFFBEB; color: #D97706; border: 1px solid rgba(217,119,6,.15); }

/* ── Main Grid */
.main { padding: 44px 48px 60px; flex: 1; }
.grid-label {
  font-size: 13px; font-weight: 700; color: #0F172A;
  letter-spacing: -.3px; margin-bottom: 18px;
  display: flex; align-items: center; gap: 8px;
}
.grid-label::before {
  content: ''; width: 4px; height: 16px; background: #2563EB; border-radius: 2px;
}

.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }

/* ── Dashboard Card */
.dash-card {
  background: #fff;
  border: 1px solid #E2E8F0;
  border-radius: 16px;
  padding: 30px;
  text-decoration: none;
  transition: transform .18s, box-shadow .18s, border-color .18s;
  display: block;
  box-shadow: 0 2px 8px rgba(15,23,42,.05);
}
.dash-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 32px rgba(15,23,42,.12);
  border-color: #BFDBFE;
}
.card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.card-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.icon-blue   { background: #EFF6FF; }
.icon-green  { background: #ECFDF5; }
.icon-purple { background: #F5F3FF; }
.icon-indigo { background: #EEF2FF; }
.card-tag {
  font-size: 10px; font-family: 'Pretendard', sans-serif;
  padding: 3px 10px; border-radius: 20px; font-weight: 500;
  background: #F1F5F9; color: #64748B;
}

.card-title { font-size: 18px; font-weight: 700; color: #0F172A; letter-spacing: -.5px; }
.card-desc  { font-size: 13px; color: #64748B; margin-top: 6px; line-height: 1.6; }

.card-meta { margin-top: 20px; padding-top: 16px; border-top: 1px solid #F1F5F9; }
.meta-row { display: flex; justify-content: space-between; align-items: center; }
.meta-items { display: flex; gap: 6px; flex-wrap: wrap; }
.meta-chip {
  font-size: 11px; padding: 3px 9px; border-radius: 6px;
  background: #F8FAFC; color: #64748B; border: 1px solid #E2E8F0;
}
.meta-chip.active { background: #EFF6FF; color: #2563EB; border-color: rgba(37,99,235,.2); }
.arrow-btn {
  font-size: 12px; font-weight: 600; color: #2563EB;
  display: flex; align-items: center; gap: 4px;
  background: #EFF6FF; padding: 6px 14px; border-radius: 8px;
  transition: background .15s;
}
.dash-card:hover .arrow-btn { background: #DBEAFE; }

/* ── Stats row */
.stats-row {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 18px; margin-top: 20px;
}
.stat-box {
  position: relative; overflow: hidden;
  background: #fff; border: 1px solid #E2E8F0;
  border-radius: 14px; padding: 22px 24px;
  box-shadow: 0 2px 10px rgba(15,23,42,.05);
  transition: transform .15s, box-shadow .15s;
}
.stat-box:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,23,42,.09); }
.stat-box::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
}
.stat-box:nth-child(1)::before { background: #2563EB; }
.stat-box:nth-child(2)::before { background: #059669; }
.stat-box:nth-child(3)::before { background: #D97706; }
.stat-box:nth-child(4)::before { background: #7C3AED; }
.stat-label { font-size: 11px; color: #94A3B8; text-transform: uppercase; letter-spacing: .8px; font-weight: 600; }
.stat-val   { font-size: 30px; font-weight: 800; color: #0F172A; font-family: 'Pretendard', sans-serif;
              margin-top: 8px; letter-spacing: -1.2px; line-height: 1; }
.stat-sub   { font-size: 12px; color: #64748B; margin-top: 8px; font-weight: 500; }
.stat-ref   { font-size: 11px; color: #94A3B8; margin-top: 8px; font-weight: 400; }
.data-notice {
  display: flex; align-items: center; gap: 10px;
  background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 10px;
  padding: 12px 18px; margin-bottom: 24px;
}
.notice-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #2563EB;
  flex-shrink: 0; box-shadow: 0 0 0 3px rgba(37,99,235,.15);
}
.notice-text { font-size: 13px; color: #1E40AF; line-height: 1.5; }
.notice-text strong { font-weight: 700; }

/* ── Footer */
.footer {
  background: #fff; border-top: 1px solid #E2E8F0;
  padding: 20px 48px;
  display: flex; justify-content: space-between; align-items: center;
}
.footer-left  { font-size: 12px; color: #94A3B8; font-family: 'Pretendard', sans-serif; }
.footer-right { font-size: 11px; color: #CBD5E1; }

@media (max-width: 768px) {
  .header, .hero, .main, .footer { padding-left: 20px; padding-right: 20px; }
  .hero { flex-direction: column; align-items: flex-start; }
  .hero h2 { font-size: 24px; }
  .stats-row { grid-template-columns: 1fr 1fr; }
}
</style>

<style id="lock-css">
#lockbox{position:fixed;inset:0;background:#0F172A;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif}
#lockbox .lock-card{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
#lockbox .lock-ico{width:48px;height:48px;background:#2563EB;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 16px}
#lockbox .lock-t{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;color:#1a1d23}
#lockbox .lock-s{font-size:12px;color:#9499ab;line-height:1.7;margin-bottom:24px}
#lockbox .lock-in{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;border:1.5px solid #d1d5db;border-radius:10px;outline:none;text-align:center;letter-spacing:2px}
#lockbox .lock-in:focus{border-color:#4b7cf3;box-shadow:0 0 0 3px rgba(75,124,243,.12)}
#lockbox .lock-btn{width:100%;margin-top:10px;padding:12px;font-size:13.5px;font-weight:700;font-family:inherit;background:#2563EB;color:#fff;border:0;border-radius:10px;cursor:pointer}
#lockbox .lock-btn:hover{background:#1d4ed8}
#lockbox .lock-btn:disabled{opacity:.6;cursor:wait}
#lockbox .lock-err{font-size:11.5px;color:#ef4444;margin-top:12px;min-height:16px;font-weight:600}
#lockbox .lock-note{font-size:10px;color:#b0b5c2;line-height:1.7;margin-top:22px;padding-top:16px;border-top:1px solid #e8eaed}
</style>
</head>
<body>
<div id="lockbox">
  <div class="lock-card">
    <div class="lock-ico">🔒</div>
    <div class="lock-t">에스씨지랩 경영정보</div>
    <div class="lock-s">내부 임직원 전용 페이지입니다.<br>비밀번호를 입력해 주세요.</div>
    <input type="password" id="lock-pw" class="lock-in" placeholder="비밀번호" autocomplete="off" autofocus>
    <button class="lock-btn" id="lock-go">열람하기</button>
    <div class="lock-err" id="lock-err"></div>
    <div class="lock-note">본 페이지의 정보는 대외비입니다.<br>무단 열람·복제·외부 반출을 금합니다.</div>
  </div>
</div>

    const ks=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:B(P.s),iterations:P.n,hash:'SHA-256'},ks,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(P.i)},key,B(P.c));
    return new TextDecoder().decode(pt);
  }

  function open_(html){
    vault.innerHTML=html;
    // 봉인 해제 후 내부 <script> 재실행 (innerHTML은 스크립트를 실행하지 않음)
    vault.querySelectorAll('script').forEach(function(old){
      const s=document.createElement('script');
      for(const a of old.attributes) s.setAttribute(a.name,a.value);
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
    box.remove();
    document.getElementById('sealed').remove();
    document.getElementById('lock-css').remove();
  }

  async function tryPw(pw,silent){
    if(busy||!pw) return false;
    busy=true; btn.textContent='해독 중…'; btn.disabled=true; err.textContent='';
    try{
      const html=await unseal(pw);
      sessionStorage.setItem('scg_k',pw);
      open_(html); return true;
    }catch(e){
      sessionStorage.removeItem('scg_k');
      if(!silent){ err.textContent='비밀번호가 올바르지 않습니다.'; inp.value=''; inp.focus(); }
      btn.textContent='열람하기'; btn.disabled=false; busy=false; return false;
    }
  }

  btn.onclick=()=>tryPw(inp.value,false);
  inp.onkeydown=e=>{ if(e.key==='Enter') tryPw(inp.value,false); };

  // 세션에 저장된 비번으로 자동 해제 (페이지 이동 시 재입력 불필요)
  const saved=sessionStorage.getItem('scg_k');
  if(saved) tryPw(saved,true).then(ok=>{ if(!ok){ btn.textContent='열람하기'; btn.disabled=false; busy=false; inp.focus(); } });
})();
</script>
</body>
