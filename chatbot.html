<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>에스씨지랩</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F8FAFC; --bg2:#FFFFFF; --bg3:#F1F5F9;
  --border:#E2E8F0; --text:#1E293B; --text2:#475569; --text3:#94A3B8;
  --blue:#2563EB; --blue-dim:#EFF6FF; --blue-dark:#1D4ED8;
  --green:#059669; --green-dim:#ECFDF5;
  --radius:12px; --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard',sans-serif;font-size:14px;height:100vh;display:flex;flex-direction:column;;letter-spacing:-.2px}

/* Header */
.header{background:#0F172A;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{width:34px;height:34px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;text-decoration:none;transition:transform .15s,box-shadow .15s;}
.logo:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.4);}
.brand-text h1{font-size:16px;font-weight:800;color:#fff;}
.brand-text p{font-size:11px;color:#64748B;font-family:'DM Mono',monospace;margin-top:1px;}
.header-right{display:flex;gap:10px;align-items:center;}
.back-btn{font-size:12px;font-weight:500;background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:8px;padding:6px 14px;text-decoration:none;transition:background .15s;}
.back-btn:hover{background:var(--border);}
.key-btn{font-size:12px;font-weight:500;background:var(--blue-dim);color:var(--blue);border:1px solid rgba(37,99,235,.2);border-radius:8px;padding:6px 14px;cursor:pointer;transition:background .15s;}
.key-btn:hover{background:#DBEAFE;}
.data-badge{font-size:11px;font-family:'DM Mono',monospace;background:var(--green-dim);color:var(--green);border:1px solid rgba(5,150,105,.15);border-radius:20px;padding:3px 12px;}

/* Main Layout */
.main{display:flex;flex:1;overflow:hidden;}

/* Sidebar */
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sidebar-section{padding:16px;}
.sidebar-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;}
.suggest-btn{display:block;width:100%;text-align:left;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text2);cursor:pointer;margin-bottom:6px;transition:background .15s,border-color .15s;font-family:'Pretendard',sans-serif;line-height:1.4;}
.suggest-btn:hover{background:var(--blue-dim);border-color:rgba(37,99,235,.2);color:var(--blue);}
.suggest-btn.report{background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.35);color:var(--blue);font-weight:700;}
.suggest-btn.report:hover{background:rgba(37,99,235,.15);border-color:rgba(37,99,235,.5);color:var(--blue);}
.suggest-btn.report::before{content:'📋 ';}
.suggest-btn.report.last{margin-bottom:10px;}
.divider{height:1px;background:var(--border);margin:4px 16px;}
.sidebar-note{padding:12px 16px;font-size:11px;color:var(--text3);line-height:1.6;}

/* Chat Area */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.messages{flex:1;overflow-y:auto;padding:24px 28px;display:flex;flex-direction:column;gap:16px;}

/* Welcome */
.welcome{text-align:center;padding:32px 20px;color:var(--text3);}
.welcome-icon{font-size:40px;margin-bottom:12px;}
.welcome h2{font-size:18px;font-weight:700;color:var(--text);margin-bottom:8px;}
.welcome p{font-size:13px;line-height:1.7;max-width:400px;margin:0 auto;}

/* Message Bubbles */
.msg{display:flex;gap:10px;max-width:80%;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.assistant{align-self:flex-start;}
.msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-top:2px;}
.msg.user .msg-avatar{background:linear-gradient(135deg,#2563EB,#1D4ED8);color:#fff;font-size:8px;line-height:1.05;letter-spacing:.5px;font-weight:800;text-align:center;}
.msg.assistant .msg-avatar{background:var(--bg3);color:var(--text2);border:1px solid var(--border);}
.msg-bubble{padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.7;word-break:break-word;}
.msg.user .msg-bubble{background:var(--blue);color:#fff;border-radius:12px 4px 12px 12px;}
.msg.assistant .msg-bubble{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:4px 12px 12px 12px;}
.msg.assistant .msg-bubble table{border-collapse:collapse;width:100%;margin:10px 0;font-size:12px;}
.msg.assistant .msg-bubble th{background:var(--bg3);padding:7px 12px;text-align:left;border:1px solid var(--border);font-weight:600;}
.msg.assistant .msg-bubble td{padding:7px 12px;border:1px solid var(--border);}
.msg.assistant .msg-bubble tr:hover td{background:var(--bg3);}
.msg.assistant .msg-bubble h3{font-size:14px;font-weight:700;margin:14px 0 6px;color:var(--text);}
.msg.assistant .msg-bubble h2{font-size:15px;font-weight:700;margin:14px 0 6px;}
.msg.assistant .msg-bubble p{margin:6px 0;line-height:1.7;}
.msg.assistant .msg-bubble ul,.msg.assistant .msg-bubble ol{padding-left:18px;margin:6px 0;}
.msg.assistant .msg-bubble li{margin:3px 0;line-height:1.6;}
.msg.assistant .msg-bubble strong{font-weight:700;}
.msg.assistant .msg-bubble hr{border:none;border-top:none;height:0;margin:8px 0;}
.msg.assistant .msg-bubble del,.msg.assistant .msg-bubble s,.msg.assistant .msg-bubble strike{text-decoration:none;}
.msg.assistant .msg-bubble hr{border:none;border-top:1px solid var(--border);margin:12px 0;}
.msg.assistant .msg-bubble blockquote{border-left:3px solid var(--blue);padding-left:10px;color:var(--text2);margin:8px 0;}
.msg.assistant .msg-bubble code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-family:'DM Mono',monospace;font-size:12px;}
.msg-loading .msg-bubble{color:var(--text3);}
.typing-dot{display:inline-block;width:6px;height:6px;background:var(--text3);border-radius:50%;margin:0 2px;animation:blink 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.2;}40%{opacity:1;}}

/* Input Area */
.input-area{padding:16px 28px 20px;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;}
.input-row{display:flex;gap:10px;align-items:flex-end;}
.input-wrap{flex:1;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius);display:flex;align-items:flex-end;transition:border-color .15s;padding:0 4px 0 0;}
.input-wrap:focus-within{border-color:var(--blue);}
textarea{flex:1;border:none;background:transparent;padding:12px 14px;font-size:13px;font-family:'Pretendard',sans-serif;color:var(--text);resize:none;outline:none;max-height:120px;line-height:1.6;}
textarea::placeholder{color:var(--text3);}
.send-btn{width:40px;height:40px;background:var(--blue);color:#fff;border:none;border-radius:9px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;margin:4px 4px 4px 0;}
.send-btn:hover{background:var(--blue-dark);}
.send-btn:disabled{background:var(--border);cursor:not-allowed;}
.input-hint{font-size:11px;color:var(--text3);margin-top:7px;}

/* API Key Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:#fff;border-radius:16px;padding:28px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal h3{font-size:16px;font-weight:700;margin-bottom:6px;}
.modal p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:16px;}
.modal input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-family:'DM Mono',monospace;outline:none;transition:border-color .15s;}
.modal input:focus{border-color:var(--blue);}
.modal-btns{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.btn-cancel{padding:9px 18px;background:var(--bg3);color:var(--text2);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;font-family:'Pretendard',sans-serif;}
.btn-save{padding:9px 18px;background:var(--blue);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;font-family:'Pretendard',sans-serif;}
.modal-note{font-size:11px;color:var(--text3);margin-top:10px;line-height:1.5;}

/* Error */
.error-msg{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;border-radius:8px;padding:10px 14px;font-size:12px;margin-top:8px;}

/* 답변 복사 버튼 */
.msg-actions{margin-top:10px;padding-top:8px;border-top:1px solid var(--bg3);display:flex;gap:8px;}
.copy-btn{font-size:11px;color:var(--text3);background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;font-family:'Pretendard',sans-serif;}
.copy-btn:hover{background:var(--blue-dim);color:var(--blue);border-color:rgba(37,99,235,.2);}
/* 응답 잘림 → 이어서 보기 */
.truncate-notice{align-self:center;font-size:12px;color:var(--text3);background:var(--bg3);border:1px dashed var(--border);border-radius:8px;padding:8px 14px;display:flex;align-items:center;gap:8px;margin:4px 0;}
.continue-btn{font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-dim);border:1px solid rgba(37,99,235,.2);border-radius:6px;padding:4px 12px;cursor:pointer;font-family:'Pretendard',sans-serif;}
.continue-btn:hover{background:#DBEAFE;}
/* 모바일 추천질문 칩 바 (데스크톱에서는 숨김) */
.mobile-suggest{display:none;}

@media(max-width:700px){
  .sidebar{display:none;}
  .messages{padding:16px;}
  .input-area{padding:12px 16px 16px;}
  .mobile-suggest{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg2);border-top:1px solid var(--border);-webkit-overflow-scrolling:touch;}
  .mobile-suggest::-webkit-scrollbar{display:none;}
  .mobile-chip{flex-shrink:0;white-space:nowrap;font-size:12px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:6px 13px;cursor:pointer;font-family:'Pretendard',sans-serif;}
  .mobile-chip.report{background:var(--blue-dim);color:var(--blue);border-color:rgba(37,99,235,.25);font-weight:600;}
}
</style>

#lockbox .lock-card{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
#lockbox .lock-ico{width:48px;height:48px;background:#2563EB;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 16px}
#lockbox .lock-t{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;color:#1a1d23}
#lockbox .lock-s{font-size:12px;color:#9499ab;line-height:1.7;margin-bottom:24px}
#lockbox .lock-in{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;border:1.5px solid #d1d5db;border-radius:10px;outline:none;text-align:center;letter-spacing:2px}
#lockbox .lock-in:focus{border-color:#4b7cf3;box-shadow:0 0 0 3px rgba(75,124,243,.12)}
#lockbox .lock-btn{width:100%;margin-top:10px;padding:12px;font-size:13.5px;font-weight:700;font-family:inherit;background:#2563EB;color:#fff;border:0;border-radius:10px;cursor:pointer}
#lockbox .lock-btn:hover{background:#1d4ed8}
#lockbox .lock-btn:disabled{opacity:.6;cursor:wait}
#lockbox .lock-err{font-size:11.5px;color:#ef4444;margin-top:12px;min-height:16px;font-weight:600}
#lockbox .lock-note{font-size:10px;color:#b0b5c2;line-height:1.7;margin-top:22px;padding-top:16px;border-top:1px solid #e8eaed}
</style>
</head>

</div>

<script>
(function(){
  const B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const P=JSON.parse(document.getElementById('sealed').textContent);
  const box=document.getElementById('lockbox'), vault=document.getElementById('vault');
  const inp=document.getElementById('lock-pw'), btn=document.getElementById('lock-go'), err=document.getElementById('lock-err');
  let busy=false;

  async function unseal(pw){
    const ks=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:B(P.s),iterations:P.n,hash:'SHA-256'},ks,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(P.i)},key,B(P.c));
    return new TextDecoder().decode(pt);
  }

  function open_(html){
    vault.innerHTML=html;
    // 봉인 해제 후 내부 <script> 재실행 (innerHTML은 스크립트를 실행하지 않음)
    vault.querySelectorAll('script').forEach(function(old){
      const s=document.createElement('script');
      for(const a of old.attributes) s.setAttribute(a.name,a.value);
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
    box.remove();
    document.getElementById('sealed').remove();
    document.getElementById('lock-css').remove();
  }

  async function tryPw(pw,silent){
    if(busy||!pw) return false;
    busy=true; btn.textContent='해독 중…'; btn.disabled=true; err.textContent='';
    try{
      const html=await unseal(pw);
      sessionStorage.setItem('scg_k',pw);
      open_(html); return true;
    }catch(e){
      sessionStorage.removeItem('scg_k');
      if(!silent){ err.textContent='비밀번호가 올바르지 않습니다.'; inp.value=''; inp.focus(); }
      btn.textContent='열람하기'; btn.disabled=false; busy=false; return false;
    }
  }

  btn.onclick=()=>tryPw(inp.value,false);
  inp.onkeydown=e=>{ if(e.key==='Enter') tryPw(inp.value,false); };

  // 세션에 저장된 비번으로 자동 해제 (페이지 이동 시 재입력 불필요)
  const saved=sessionStorage.getItem('scg_k');
  if(saved) tryPw(saved,true).then(ok=>{ if(!ok){ btn.textContent='열람하기'; btn.disabled=false; busy=false; inp.focus(); } });
})();
</script>
