<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>에스씨지랩</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f5f7;--white:#fff;--border:#e8eaed;--border2:#d1d5db;
  --text:#1a1d23;--text2:#52576a;--text3:#9499ab;
  --blue:#4b7cf3;--mint:#1ec997;--gold:#d97706;--purple:#7c3aed;
  --red:#ef4444;--green:#059669;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
html{background:var(--bg)}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}

.hdr{background:#0F172A;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(15,23,42,.15)}
.logo{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.4px} .logo em{color:#fff;font-style:normal}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr-logo{width:36px;height:36px;background:#2563EB;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;text-decoration:none;flex-shrink:0;transition:transform .15s,box-shadow .15s}
.hdr-logo:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(37,99,235,.4)}
.hdr-right{display:flex;align-items:center;gap:12px}
.back-btn{font-size:12px;font-weight:500;background:rgba(255,255,255,.06);color:#CBD5E1;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:6px 14px;cursor:pointer;text-decoration:none;transition:background .15s}
.back-btn:hover{background:rgba(255,255,255,.14)}
.ai-btn{font-size:12px;font-weight:600;background:#2563EB;color:#fff;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;text-decoration:none;transition:background .15s}
.ai-btn:hover{background:#1D4ED8}
.hdr-meta{font-size:11px;color:#64748B} .hdr-meta b{color:#CBD5E1}

.tabs{background:var(--white);border-bottom:1px solid var(--border);padding:0 32px;display:flex}
.tab{padding:14px 20px;font-size:13px;font-weight:500;color:var(--text3);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;font-family:inherit}
.tab:hover{color:var(--text2)} .tab.on{color:var(--text);border-bottom-color:var(--mint);font-weight:600}
.qfsub{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--white);color:var(--text3);font-weight:500;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s}
.qfsub:hover{color:var(--text2)} .qfsub.on{background:#eef2ff;border-color:#c7d2fe;color:#4338ca;font-weight:600}

.wrap{max-width:1440px;margin:0 auto;padding:24px 32px}
.page{display:none} .page.on{display:block}

.fbar{display:flex;align-items:center;gap:6px;margin-bottom:20px}
.flabel{font-size:11px;color:var(--text3);margin-right:4px;font-weight:500}
.fb{padding:5px 14px;font-size:12px;font-weight:500;border:1.5px solid var(--border2);border-radius:20px;background:var(--white);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.fb:hover{border-color:var(--mint);color:var(--mint)} .fb.on{background:var(--text);border-color:var(--text);color:#fff}
.fb.confirmed{background:#e0f2fe;border-color:#38bdf8;color:#0369a1;font-weight:600}
.fb.confirmed.on{background:#0ea5e9;border-color:#0284c7;color:#fff}
.fb.confirmed.on::after{content:' ✓';font-weight:700}
.fb:disabled{background:#f1f5f9;border-color:#e2e8f0;color:#cbd5e1;cursor:not-allowed}
.fb:disabled:hover{border-color:#e2e8f0;color:#cbd5e1}
.fb.mbtn:hover{border-color:#0284c7;color:#0284c7}
.fb.mbtn.confirmed:hover{background:#bae6fd}

.kpi-row{display:grid;gap:12px;margin-bottom:16px}
.kpi5{grid-template-columns:repeat(5,1fr)}
.kpi4{grid-template-columns:repeat(4,1fr)}
.kcard{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.kcard.accent{border-left:3px solid var(--mint)}
.klabel{font-size:11px;color:var(--text3);font-weight:500;margin-bottom:5px}
.kval{font-size:22px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.ksub{font-size:11px;color:var(--text3);margin-top:4px}
.ktag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;margin-top:5px}
.ktag.up{background:rgba(5,150,105,.1);color:var(--green)}
.ktag.dn{background:rgba(239,68,68,.1);color:var(--red)}
.kcard-hint{font-size:10px;color:var(--text3);margin-top:2px;font-style:italic}

/* 잔여목표/연간계획 배너 */
.plan-banner{background:linear-gradient(135deg,#f0f4ff,#e8f5f0);border:1px solid #c7d7f5;border-radius:12px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.pb-item{text-align:center;min-width:80px}
.pb-label{font-size:10px;color:var(--text3);margin-bottom:3px;white-space:nowrap}
.pb-val{font-size:15px;font-weight:700;white-space:nowrap}
.pb-div{width:1px;background:var(--border2);height:32px;flex-shrink:0}
.pb-exceed{background:rgba(5,150,105,.12);border:1px solid rgba(5,150,105,.3);border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--green);white-space:nowrap}

.ach3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.achcard{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 18px;box-shadow:var(--shadow)}
.achhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px}
.achlabel{font-size:12px;font-weight:600;color:var(--text2)}
.achbasis{font-size:10px;color:var(--text3);margin-top:1px;font-style:italic}
.achpct{font-size:19px;font-weight:700;letter-spacing:-.5px}
.achbar{height:5px;background:#eef0f4;border-radius:3px;overflow:hidden;margin:8px 0 7px}
.achfill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.achvals{display:flex;gap:14px;flex-wrap:wrap}
.achitem{font-size:11px;color:var(--text3)} .achitem b{color:var(--text2);font-weight:600}
.achdiff{font-size:11px;font-weight:600} .achdiff.pos{color:var(--green)} .achdiff.neg{color:var(--red)}
.ach-exceed{font-size:11px;font-weight:600;color:var(--green);background:rgba(5,150,105,.08);border-radius:4px;padding:1px 6px}

.cgrid{display:grid;gap:14px;margin-bottom:16px}
.c21{grid-template-columns:2fr 1fr}
.c11{grid-template-columns:1fr 1fr}
.c1{grid-template-columns:1fr}
.ccard{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow)}
.ctitle{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.csub{font-size:11px;color:var(--text3);margin-bottom:14px}
.cwrap{position:relative}
.h200{height:200px} .h260{height:260px} .h280{height:280px} .h300{height:300px}
.legend{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.ld{width:10px;height:10px;border-radius:2px;flex-shrink:0}

.month-summary{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.ms-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.ms-month{font-size:10px;color:var(--text3);font-weight:600;margin-bottom:6px;letter-spacing:.3px}
.ms-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.ms-label{font-size:10px;color:var(--text3)}
.ms-val{font-size:12px;font-weight:600}
.ms-footer{font-size:10px;color:var(--text3);margin-top:5px;padding-top:5px;border-top:1px solid var(--border)}

.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;margin-top:4px}
.sh h2{font-size:14px;font-weight:700}
.sh-sub{font-size:11px;color:var(--text3);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:2px 7px}

.twrap{overflow-x:auto;margin-bottom:16px;border:1px solid var(--border);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
table.wide{width:max-content;min-width:100%;table-layout:auto}
thead{background:#f8f9fb}
th{padding:7px 10px;text-align:right;color:var(--text3);font-weight:500;font-size:11px;border-bottom:1.5px solid var(--border);white-space:nowrap}
th:first-child{text-align:left;width:120px;min-width:120px;max-width:140px}
th.num{width:56px;min-width:50px}
td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);white-space:nowrap}
td:first-child{text-align:left;font-weight:500;color:var(--text2);width:120px;min-width:120px;max-width:140px}
td.ind{padding-left:20px;color:var(--text3);font-weight:400;font-size:11px}
tr.ind-row td{background:#fcfcfd;color:var(--text3) !important;font-size:11px}
tr.ind-row td:first-child{color:var(--text3);font-weight:400}
tr.ind-row td.cp{color:#9eb5fa !important}
tr.ind-row td.cb{color:#7ddbbe !important}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbfc}
tr.total td{background:#f3f4f7;font-weight:700;color:var(--text)}
tr.total td:first-child{color:var(--text)}
tr.sep td{border-top:1.5px solid var(--border2)}
tr.sub td{background:#f8f9fb}
tr.path-row td{background:#f8fbff}
tr.path-row td:first-child{padding-left:20px;color:var(--text3);font-weight:400;font-size:11px}
tr.bill-row td{background:#f5fdf9}
tr.bill-row td:first-child{padding-left:20px;color:var(--text3);font-weight:400;font-size:11px}
tr.ind-row td{background:#fcfcfd;font-size:11px}
tr.ind-row td:first-child{padding-left:20px;color:var(--text3);font-weight:400}
th.cum{color:var(--gold) !important;background:#fffbf0 !important}
td.cum{background:#fffbf0 !important;font-weight:700;color:var(--text)}
.cp{color:var(--blue)} .cb{color:var(--mint)} .cg{color:var(--gold)} .cv{color:var(--purple)}
.pos{color:var(--green);font-weight:600} .neg{color:var(--red);font-weight:600}
.plan-col{color:var(--text3);font-size:11px}
.badge{display:inline-flex;align-items:center;gap:2px;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
.badge.up{background:rgba(5,150,105,.1);color:var(--green)}
.badge.dn{background:rgba(239,68,68,.1);color:var(--red)}

.rev-toggle-wrap{margin-bottom:16px}
.rev-toggle-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;font-size:12px;font-weight:500;
  border:1.5px solid var(--border2);border-radius:20px;
  background:var(--white);color:var(--text2);
  cursor:pointer;font-family:inherit;transition:all .15s;margin-right:6px;
}
.rev-toggle-btn:hover{border-color:var(--blue);color:var(--blue)}
.rev-toggle-btn.active{background:var(--blue);border-color:var(--blue);color:#fff}
.rev-section{
  background:var(--white);border:1px solid var(--border);
  border-radius:12px;padding:18px 22px;box-shadow:var(--shadow);
  margin-bottom:16px;display:none;
}
.rev-section.show{display:block}
.rev-table{width:100%;border-collapse:collapse;font-size:12px}
.rev-table th{
  padding:7px 10px;text-align:right;font-size:11px;font-weight:500;
  color:var(--text3);border-bottom:1.5px solid var(--border);white-space:nowrap;
  background:#f8f9fb;
}
.rev-table th:first-child{text-align:left;width:110px;position:sticky;left:0;background:#f8f9fb;z-index:2}
.rev-table td{
  padding:6px 10px;text-align:right;font-size:12px;
  border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text2);
}
.rev-table td:first-child{
  text-align:left;font-weight:600;color:var(--text2);
  position:sticky;left:0;background:var(--white);z-index:1;
}
.rev-table tr.total td{background:#f3f4f7;font-weight:700;color:var(--text)}
.rev-table tr.total td:first-child{background:#f3f4f7}
.rev-table tr:hover td{background:#fafbfc}
.rev-table tr:hover td:first-child{background:#f0f4ff}
.rev-bar-wrap{height:6px;background:#eef0f4;border-radius:3px;overflow:hidden;margin-top:3px}
.rev-bar{height:100%;border-radius:3px}
#totop{position:fixed;bottom:20px;right:20px;background:var(--text);width:34px;height:34px;border-radius:50%;border:none;cursor:pointer;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;opacity:0;transition:.25s;z-index:999}
#totop.show{opacity:1}

@media(max-width:1000px){
  .kpi5,.kpi4{grid-template-columns:repeat(2,1fr)}
  .ach3,.c21,.c11{grid-template-columns:1fr}
  .wrap{padding:16px}
  .month-summary{grid-template-columns:repeat(3,1fr)}
  .plan-banner{justify-content:flex-start}
}
#dashTooltip{position:fixed;background:#1E293B;color:#fff;font-size:12px;font-family:'Pretendard',sans-serif;line-height:1.6;padding:9px 13px;border-radius:8px;max-width:280px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:normal;}
#dashTooltip.show{opacity:1;}
.tip-anchor{border-bottom:1px dotted var(--border2);cursor:help;}
.tip-anchor .tip-i{color:var(--blue);font-size:9px;vertical-align:super;margin-left:2px;}
</style>

#lockbox{position:fixed;inset:0;background:#0F172A;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif}
#lockbox .lock-card{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
#lockbox .lock-ico{width:48px;height:48px;background:#2563EB;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 16px}
#lockbox .lock-t{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;color:#1a1d23}
#lockbox .lock-s{font-size:12px;color:#9499ab;line-height:1.7;margin-bottom:24px}
#lockbox .lock-in{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;border:1.5px solid #d1d5db;border-radius:10px;outline:none;text-align:center;letter-spacing:2px}
#lockbox .lock-in:focus{border-color:#4b7cf3;box-shadow:0 0 0 3px rgba(75,124,243,.12)}
#lockbox .lock-btn{width:100%;margin-top:10px;padding:12px;font-size:13.5px;font-weight:700;font-family:inherit;background:#2563EB;color:#fff;border:0;border-radius:10px;cursor:pointer}
#lockbox .lock-btn:hover{background:#1d4ed8}
#lockbox .lock-btn:disabled{opacity:.6;cursor:wait}
#lockbox .lock-err{font-size:11.5px;color:#ef4444;margin-top:12px;min-height:16px;font-weight:600}
#lockbox .lock-note{font-size:10px;color:#b0b5c2;line-height:1.7;margin-top:22px;padding-top:16px;border-top:1px solid #e8eaed}
</style>

  <div class="lock-card">

    <div class="lock-t">경영정보 대시보드</div>
    <div class="lock-s">내부 임직원 전용 페이지입니다.<br>비밀번호를 입력해 주세요.</div>
    <input type="password" id="lock-pw" class="lock-in" placeholder="비밀번호" autocomplete="off" autofocus>
    <button class="lock-btn" id="lock-go">열람하기</button>
    <div class="lock-err" id="lock-err"></div>
    <div class="lock-note">본 페이지의 정보는 대외비입니다.<br>무단 열람·복제·외부 반출을 금합니다.</div>
  </div>
</div>

<script>
(function(){
  const B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const P=JSON.parse(document.getElementById('sealed').textContent);
  const box=document.getElementById('lockbox'), vault=document.getElementById('vault');
  const inp=document.getElementById('lock-pw'), btn=document.getElementById('lock-go'), err=document.getElementById('lock-err');
  let busy=false;

  async function unseal(pw){
    const ks=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:B(P.s),iterations:P.n,hash:'SHA-256'},ks,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(P.i)},key,B(P.c));
    return new TextDecoder().decode(pt);
  }

  function open_(html){
    vault.innerHTML=html;
    // 봉인 해제 후 내부 <script> 재실행 (innerHTML은 스크립트를 실행하지 않음)
    vault.querySelectorAll('script').forEach(function(old){
      const s=document.createElement('script');
      for(const a of old.attributes) s.setAttribute(a.name,a.value);
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
    box.remove();
    document.getElementById('sealed').remove();
    document.getElementById('lock-css').remove();
  }

  async function tryPw(pw,silent){
    if(busy||!pw) return false;
    busy=true; btn.textContent='해독 중…'; btn.disabled=true; err.textContent='';
    try{
      const html=await unseal(pw);
      sessionStorage.setItem('scg_k',pw);
      open_(html); return true;
    }catch(e){
      sessionStorage.removeItem('scg_k');
      if(!silent){ err.textContent='비밀번호가 올바르지 않습니다.'; inp.value=''; inp.focus(); }
      btn.textContent='열람하기'; btn.disabled=false; busy=false; return false;
    }
  }

  btn.onclick=()=>tryPw(inp.value,false);
  inp.onkeydown=e=>{ if(e.key==='Enter') tryPw(inp.value,false); };

  // 세션에 저장된 비번으로 자동 해제 (페이지 이동 시 재입력 불필요)
  const saved=sessionStorage.getItem('scg_k');
  if(saved) tryPw(saved,true).then(ok=>{ if(!ok){ btn.textContent='열람하기'; btn.disabled=false; busy=false; inp.focus(); } });
})();
</script>
</body>
</html>
