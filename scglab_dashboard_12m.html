<script>
(function(){
  "use strict";
  var SK   = "scglab_seal_v1";
  var D    = JSON.parse(document.getElementById('sealed').textContent);
  var pwEl = document.getElementById('pw');
  var btn  = document.getElementById('go');
  var msg  = document.getElementById('msg');

  function b2a(b){ var s='', u=new Uint8Array(b);
    for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
  function a2b(a){ var s=atob(a), u=new Uint8Array(s.length);
    for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
  function say(t,cls){ msg.textContent=t; msg.className='msg '+(cls||'inf'); }

  async function open_(pw, silent){
    btn.disabled = true;
    if(!silent) say('복호화 중입니다…','inf');
    try{
      var enc = new TextEncoder();
      var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
      var key  = await crypto.subtle.deriveKey(
        { name:'PBKDF2', salt:a2b(D.salt), iterations:D.iter, hash:'SHA-256' },
        base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:a2b(D.iv) }, key, a2b(D.ct));
      var bytes = new Uint8Array(plain);
      if(D.gz){
        if(typeof DecompressionStream === 'undefined')
          throw new Error('이 브라우저는 압축 해제를 지원하지 않습니다. 최신 브라우저를 사용하십시오.');
        var ds = new DecompressionStream('gzip');
        var st = new Blob([bytes]).stream().pipeThrough(ds);
        bytes = new Uint8Array(await new Response(st).arrayBuffer());
      }
      var html = new TextDecoder('utf-8').decode(bytes);
      try{ sessionStorage.setItem(SK, pw); }catch(e){}
      document.open(); document.write(html); document.close();
    }catch(e){
      btn.disabled = false;
      if(silent){ try{ sessionStorage.removeItem(SK); }catch(e2){} say(''); }
      else { say(e && e.message && e.message.indexOf('브라우저')>=0
               ? e.message : '비밀번호가 올바르지 않습니다.', 'err');
             pwEl.select(); }
    }
  }

  btn.addEventListener('click', function(){
    var v = pwEl.value;
    if(!v){ say('비밀번호를 입력하십시오.','err'); pwEl.focus(); return; }
    open_(v, false);
  });
  pwEl.addEventListener('keydown', function(e){ if(e.key==='Enter') btn.click(); });

  /* 같은 세션에서 이미 인증했다면 자동 해제 */
  var saved = null;
  try{ saved = sessionStorage.getItem(SK); }catch(e){}
  if(saved){ say('세션 인증 확인 중…','inf'); open_(saved, true); }
})();
</script>
