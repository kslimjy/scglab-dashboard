<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>에스씨지랩</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f5f7;--white:#fff;--border:#e8eaed;--border2:#d1d5db;--text:#1a1d23;--text2:#52576a;--text3:#9499ab;--blue:#4b7cf3;--mint:#1ec997;--gold:#d97706;--purple:#7c3aed;--red:#ef4444;--green:#059669;--shadow:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)}
html{background:var(--bg)}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
.hdr{background:#0F172A;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(15,23,42,.15)}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr-logo{width:36px;height:36px;background:#2563EB;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;flex-shrink:0;text-decoration:none;transition:transform .15s,box-shadow .15s}
.hdr-logo:hover{transform:scale(1.05);box-shadow:0 0 0 3px rgba(37,99,235,.3)}
.logo{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.4px}
.hdr-meta{font-size:11px;color:#64748B}
.hdr-meta b{color:#CBD5E1}
.wrap{max-width:1440px;margin:0 auto;padding:24px 32px}
.pagetitle{font-size:20px;font-weight:700;margin-bottom:4px}
.pagesub{font-size:12px;color:var(--text3);margin-bottom:20px}
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 20px;box-shadow:var(--shadow);min-width:110px}
.stat .num{font-size:22px;font-weight:800;color:var(--text)}
.stat .lbl{font-size:11px;color:var(--text3);margin-top:2px}
.fbar{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.flabel{font-size:11px;color:var(--text3);margin-right:4px;font-weight:600;min-width:28px}
.fb{padding:5px 14px;font-size:12px;font-weight:500;border:1.5px solid var(--border2);border-radius:20px;background:var(--white);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.fb:hover{border-color:var(--blue);color:var(--blue)}
.fb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fb.virt{border-style:dashed}
.fb.virt.on{background:#6b7280;border-color:#6b7280;color:#fff}
.fb.gender.on{background:var(--mint);border-color:var(--mint)}
.fb.grade.on{background:var(--gold);border-color:var(--gold)}
.searchbox{margin-left:auto;padding:6px 14px;font-size:12px;border:1.5px solid var(--border2);border-radius:20px;font-family:inherit;width:200px;outline:none}
.searchbox:focus{border-color:var(--blue)}
.fbar-last{margin-bottom:14px}
.resetbtn{padding:5px 12px;font-size:11px;font-weight:500;border:1px solid var(--border2);border-radius:20px;background:#f8f9fb;color:var(--text3);cursor:pointer;font-family:inherit}
.resetbtn:hover{color:var(--red);border-color:var(--red)}
.divider{height:1px;background:var(--border);margin:2px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.parthead{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:8px 0 -4px;padding:0}
.parthead:first-child{margin-top:0}
.parthead .ph-name{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;letter-spacing:-.3px}
.parthead .ph-cnt{font-size:11px;font-weight:600;color:var(--blue);background:#eef4ff;padding:2px 9px;border-radius:10px;white-space:nowrap}
.parthead .ph-line{flex:1;height:1px;background:var(--border);min-width:20px}
.card{position:relative;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:center;cursor:default;transition:box-shadow .18s,border-color .18s;overflow:visible}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1),0 2px 6px rgba(0,0,0,.06);border-color:var(--blue)}
.card.hide{display:none}
.photo{position:relative;width:76px;height:76px;border-radius:14px;overflow:hidden;flex-shrink:0;background:#e8eaed;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--text3);font-weight:700}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.info{flex:1;min-width:0}
.name-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.name{font-size:19px;font-weight:700}
.gdot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;transform:translateY(-3px);cursor:help}
.g-m{background:#85B7EB}
.g-f{background:#ED93B1}
.notemark{font-size:13px;color:#b4b2a9;cursor:help;line-height:1;transform:translateY(-1px);transition:color .15s}
.notemark:hover{color:var(--text2)}
.pos{font-size:14px;color:var(--blue);font-weight:600}
.dept{font-size:13px;color:var(--text2);line-height:1.45}
.dept-long{font-size:11.8px;letter-spacing:-.45px;line-height:1.4}
.quickinfo{display:flex;flex-direction:column;gap:3px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.qi{font-size:12.5px;color:var(--text);display:flex;gap:7px;align-items:baseline;line-height:1.35}
.qk{font-size:10.5px;color:var(--text3);font-weight:600;min-width:26px;flex-shrink:0}
.qsub{font-size:11px;color:var(--text3);margin-left:2px}
/* 생년월일 표시 토글: 숨기려면 아래를 display:none 으로 */
.qi-birth{display:flex}
.blank{color:#c4c8d4}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px}
.b-active{background:#e6f9f2;color:var(--green)}
.b-leave{background:#fef3e6;color:var(--gold)}
.b-quit{background:#fde8e8;color:var(--red)}
.tag-v{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;background:#eef0f2;color:#6b7280}
/* hover 상세 오버레이 */
.detail{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;background:#0F172A;color:#E2E8F0;border-radius:12px;padding:14px 16px;box-shadow:0 8px 28px rgba(15,23,42,.28);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .16s,transform .16s,visibility .16s;pointer-events:none}
.card:hover .detail{opacity:1;visibility:visible;transform:translateY(0)}
.detail::before{content:"";position:absolute;top:-6px;left:32px;width:12px;height:12px;background:#0F172A;transform:rotate(45deg)}
.detail-hd{font-size:13px;font-weight:700;color:#fff;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid #1e293b}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px}
.dk{color:#94A3B8;white-space:nowrap}
.dv{color:#E2E8F0;word-break:break-all}
.detail .blank{color:#475569}
.tblwrap{background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-top:28px}
.tblwrap h3{font-size:14px;font-weight:700;padding:16px 20px;border-bottom:1px solid var(--border)}
.tblscroll{overflow-x:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:1400px}
th{background:#f8f9fb;color:var(--text2);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:5}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.hide{display:none}
tr:hover td{background:#fafbfc}
.td-name{font-weight:600}
.updated{font-size:11px;color:var(--text3);margin-top:16px;text-align:right}
.orgnote{background:#eef4ff;border:1px solid #d6e4ff;border-radius:10px;padding:12px 16px;font-size:11.5px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.orgnote b{color:var(--blue)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:24px}
.tabbtn{padding:10px 20px;font-size:13px;font-weight:600;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:inherit;transition:all .15s}
.tabbtn:hover{color:var(--text2)}
.tabbtn.on{color:var(--blue);border-bottom-color:var(--blue)}
.panel{display:none}
.panel.on{display:block}
.org-silsub{font-size:11px;font-weight:500;opacity:.75;letter-spacing:-.2px}
.orgchart{display:flex;flex-direction:column;align-items:center;gap:0}
.org-ceo{background:#0F172A;color:#fff;padding:14px 36px;border-radius:12px;font-size:15px;font-weight:700;box-shadow:var(--shadow);text-align:center}
.org-ceo .cnt{font-size:11px;font-weight:500;color:#94A3B8;margin-top:4px}
.org-conn{width:2px;height:24px;background:var(--border2)}
.org-level{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.org-sil{display:flex;flex-direction:column;align-items:center;min-width:280px;flex:1;max-width:400px}
.org-silbox{background:var(--blue);color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:700;text-align:center;box-shadow:var(--shadow);white-space:nowrap;width:100%}
.org-silbox.direct{background:var(--purple)}
.org-silbox .cnt{font-size:10.5px;font-weight:500;opacity:.85;margin-top:1px}
.org-teams{display:flex;flex-direction:column;gap:12px;margin-top:20px;width:100%}
.org-team{background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.org-teamhdr{background:#f8f9fb;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.org-teamhdr .tcnt{font-size:11px;font-weight:600;color:var(--blue);background:#eef4ff;padding:1px 8px;border-radius:10px}
.org-members{padding:6px 14px 10px}
.org-mem{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px dashed var(--border)}
.org-mem:last-child{border-bottom:none}
.org-mem .mname{font-weight:600;color:var(--text)}
.org-mem .mpos{font-size:11px;color:var(--blue);font-weight:600}
.org-part{font-size:10px;color:var(--text3);margin-left:6px;font-weight:500}
.org-partgrp{padding:2px 0}
.org-partgrp.sep{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.org-parthdr{font-size:10.5px;font-weight:700;color:var(--blue);letter-spacing:-.2px;padding:2px 0 4px;display:flex;align-items:center;gap:6px}
.org-parthdr .pcnt{font-size:9.5px;font-weight:600;color:var(--text3);background:#f1f3f6;padding:0 6px;border-radius:8px;line-height:15px}
.org-empty{font-size:11px;color:var(--text3);padding:6px 0;font-style:italic}
/* ===== 현황 대시보드 ===== */
.sec{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.sec-t{font-size:13.5px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-s{font-size:11px;color:var(--text3);margin-bottom:14px}
.sgrid{display:grid;gap:16px;margin-bottom:16px}
.sgrid.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.sgrid.c3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .n{font-size:21px;font-weight:800;letter-spacing:-.5px}
.kpi .u{font-size:12px;font-weight:600;color:var(--text3);margin-left:2px}
.kpi .l{font-size:11px;color:var(--text3);margin-top:3px}
.kpi .d{font-size:10px;color:var(--text3);margin-top:2px;opacity:.75}
.kpi.hl .n{color:var(--blue)}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.donut::after{content:'';position:absolute;inset:26px;background:var(--white);border-radius:50%}
.donut .dc{position:relative;z-index:1;text-align:center}
.donut .dc b{font-size:19px;font-weight:800;display:block;line-height:1.1}
.donut .dc span{font-size:10px;color:var(--text3)}
.leg{display:flex;flex-direction:column;gap:9px;flex:1;min-width:140px}
.leg-i{display:flex;align-items:center;gap:8px;font-size:12px}
.leg-i .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.leg-i .nm{color:var(--text2);min-width:56px}
.leg-i .vl{margin-left:auto;font-weight:700}
.leg-i .pc{color:var(--text3);font-size:11px;width:44px;text-align:right}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-r{display:flex;align-items:center;gap:10px;font-size:12px}
.bar-r .bl{min-width:104px;color:var(--text2);text-align:right;flex-shrink:0;font-weight:500}
.bar-r .bt{flex:1;height:20px;background:#f1f3f6;border-radius:5px;overflow:hidden;display:flex;min-width:40px}
.bar-r .bw{height:100%;display:flex;min-width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-r .bw .bf{border-radius:0}
.bar-r .bw .bf:first-child{border-radius:5px 0 0 5px}
.bar-r .bw .bf:last-child{border-radius:0 5px 5px 0}
.bar-r .bt>.bw:only-child>.bf:only-child{border-radius:5px}
.bar-r .bt[data-tip]{cursor:pointer}
.tip{position:fixed;z-index:9999;display:none;max-width:320px;background:#1a1d23;color:#fff;border-radius:9px;padding:10px 12px;font-size:11.5px;line-height:1.65;box-shadow:0 6px 24px rgba(0,0,0,.28);pointer-events:none;letter-spacing:-.1px}
.tip b{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#fff}
.tip .tnames{color:#cbd0d8;word-break:keep-all}
.tip.pin{pointer-events:auto;box-shadow:0 0 0 2px var(--blue),0 6px 24px rgba(0,0,0,.28)}
.tip .tpin{display:none;margin-top:7px;padding-top:6px;border-top:1px solid #343845;color:#8b90a0;font-size:10px}
.tip.pin .tpin{display:block}
.bar-r .bf{height:100%;border-radius:5px 0 0 5px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-r .bf:last-child{border-radius:5px}
.bar-r .bv{min-width:56px;text-align:right;font-weight:700;flex-shrink:0}
.bar-r .bv small{font-weight:500;color:var(--text3);margin-left:3px;font-size:10.5px}
.bar-r.acc .bl{color:var(--blue);font-weight:700}
.cols{display:flex;align-items:stretch;gap:8px;height:178px;padding:8px 0 2px}
.col-i{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:5px;min-width:0}
.col-tr{flex:1;width:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center}
.col-b{width:100%;max-width:44px;background:linear-gradient(180deg,#6f9bf7,#4b7cf3);border-radius:5px 5px 0 0;min-height:3px;transition:height .5s;position:relative;cursor:pointer}
.col-b.z{cursor:default}
.col-b.z{background:#e4e7ec}
.col-v{font-size:11px;font-weight:700;height:14px;line-height:14px;flex-shrink:0}
.col-l{font-size:10px;color:var(--text3);white-space:nowrap;flex-shrink:0;line-height:14px;height:14px}
.xt{width:100%;border-collapse:collapse;font-size:12px}
.xt th,.xt td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.xt th{background:#f8f9fb;color:var(--text3);font-size:11px;font-weight:600}
.xt th:first-child,.xt td:first-child{text-align:left;font-weight:600}
.xt td.z{color:#d5d8de}
.xt tr.tot td{background:#f8f9fb;font-weight:700;border-bottom:none}
.xt td.hi{color:var(--blue);font-weight:700}
.tw{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#f4f6fa;border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:11.5px;display:flex;align-items:center;gap:7px}
.chip b{font-weight:700}
.chip .cs{font-size:10px;color:var(--text3)}
.chip.new{background:#eef4ff;border-color:#c7d9ff}
.note{font-size:10.5px;color:var(--text3);margin-top:11px;line-height:1.6;padding-top:10px;border-top:1px dashed var(--border)}
.tg{display:inline-flex;gap:0;border:1px solid var(--border2);border-radius:16px;overflow:hidden;margin-left:auto}
.tg button{padding:3px 11px;font-size:11px;border:0;background:var(--white);color:var(--text3);cursor:pointer;font-family:inherit;font-weight:500}
.tg button.on{background:var(--blue);color:#fff}
@media(max-width:640px){.bar-r .bl{min-width:76px;font-size:11px}.kpis{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}}

/* ===== 잠금 화면 ===== */
#lockbox{position:fixed;inset:0;background:#0F172A;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.lock-ico{font-size:36px;margin-bottom:14px;line-height:1}
.lock-t{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
.lock-s{font-size:12px;color:var(--text3);line-height:1.7;margin-bottom:24px}
.lock-in{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;border:1.5px solid var(--border2);border-radius:10px;outline:none;text-align:center;letter-spacing:2px}
.lock-in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(75,124,243,.12)}
.lock-btn{width:100%;margin-top:10px;padding:12px;font-size:13.5px;font-weight:700;font-family:inherit;background:#2563EB;color:#fff;border:0;border-radius:10px;cursor:pointer;transition:background .15s}
.lock-btn:hover:not(:disabled){background:#1d4ed8}
.lock-btn:disabled{background:#94a3b8;cursor:wait}
.lock-err{font-size:11.5px;color:var(--red);margin-top:12px;min-height:16px;font-weight:600}
.lock-note{font-size:10px;color:#b0b5c2;line-height:1.7;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}
#vault:empty{min-height:60vh}

</style>
<style id="lock-css">
#lockbox{position:fixed;inset:0;background:#0F172A;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif}
#lockbox .lock-card{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
#lockbox .lock-ico{width:48px;height:48px;background:#2563EB;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 16px}
#lockbox .lock-t{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;color:#1a1d23}
#lockbox .lock-s{font-size:12px;color:#9499ab;line-height:1.7;margin-bottom:24px}
#lockbox .lock-in{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;border:1.5px solid #d1d5db;border-radius:10px;outline:none;text-align:center;letter-spacing:2px}
#lockbox .lock-in:focus{border-color:#4b7cf3;box-shadow:0 0 0 3px rgba(75,124,243,.12)}
#lockbox .lock-btn{width:100%;margin-top:10px;padding:12px;font-size:13.5px;font-weight:700;font-family:inherit;background:#2563EB;color:#fff;border:0;border-radius:10px;cursor:pointer}
#lockbox .lock-btn:hover{background:#1d4ed8}
#lockbox .lock-btn:disabled{opacity:.6;cursor:wait}
#lockbox .lock-err{font-size:11.5px;color:#ef4444;margin-top:12px;min-height:16px;font-weight:600}
#lockbox .lock-note{font-size:10px;color:#b0b5c2;line-height:1.7;margin-top:22px;padding-top:16px;border-top:1px solid #e8eaed}
</style>

    const ks=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:B(P.s),iterations:P.n,hash:'SHA-256'},ks,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(P.i)},key,B(P.c));
    return new TextDecoder().decode(pt);
  }

  function open_(html){
    vault.innerHTML=html;
    // 봉인 해제 후 내부 <script> 재실행 (innerHTML은 스크립트를 실행하지 않음)
    vault.querySelectorAll('script').forEach(function(old){
      const s=document.createElement('script');
      for(const a of old.attributes) s.setAttribute(a.name,a.value);
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
    box.remove();
    document.getElementById('sealed').remove();
    document.getElementById('lock-css').remove();
  }

  async function tryPw(pw,silent){
    if(busy||!pw) return false;
    busy=true; btn.textContent='해독 중…'; btn.disabled=true; err.textContent='';
    try{
      const html=await unseal(pw);
      sessionStorage.setItem('scg_k',pw);
      open_(html); return true;
    }catch(e){
      sessionStorage.removeItem('scg_k');
      if(!silent){ err.textContent='비밀번호가 올바르지 않습니다.'; inp.value=''; inp.focus(); }
      btn.textContent='열람하기'; btn.disabled=false; busy=false; return false;
    }
  }

  btn.onclick=()=>tryPw(inp.value,false);
  inp.onkeydown=e=>{ if(e.key==='Enter') tryPw(inp.value,false); };

  // 세션에 저장된 비번으로 자동 해제 (페이지 이동 시 재입력 불필요)
  const saved=sessionStorage.getItem('scg_k');
  if(saved) tryPw(saved,true).then(ok=>{ if(!ok){ btn.textContent='열람하기'; btn.disabled=false; busy=false; inp.focus(); } });
})();
</script>
