<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>에스씨지랩 임직원 명부</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f5f7;--white:#fff;--border:#e8eaed;--border2:#d1d5db;--text:#1a1d23;--text2:#52576a;--text3:#9499ab;--blue:#4b7cf3;--mint:#1ec997;--gold:#d97706;--purple:#7c3aed;--red:#ef4444;--green:#059669;--shadow:0 1px 3px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04)}
html{background:var(--bg)}
body{font-family:'Pretendard',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:13px;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
.hdr{background:#0F172A;padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(15,23,42,.15)}
.hdr-left{display:flex;align-items:center;gap:14px}
.hdr-logo{width:36px;height:36px;background:#2563EB;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700;flex-shrink:0;text-decoration:none;transition:transform .15s,box-shadow .15s}
.hdr-logo:hover{transform:scale(1.05);box-shadow:0 0 0 3px rgba(37,99,235,.3)}
.logo{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.4px}
.hdr-meta{font-size:11px;color:#64748B}
.hdr-meta b{color:#CBD5E1}
.wrap{max-width:1440px;margin:0 auto;padding:24px 32px}
.pagetitle{font-size:20px;font-weight:700;margin-bottom:4px}
.pagesub{font-size:12px;color:var(--text3);margin-bottom:20px}
.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px 20px;box-shadow:var(--shadow);min-width:110px}
.stat .num{font-size:22px;font-weight:800;color:var(--text)}
.stat .lbl{font-size:11px;color:var(--text3);margin-top:2px}
.fbar{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.flabel{font-size:11px;color:var(--text3);margin-right:4px;font-weight:600;min-width:28px}
.fb{padding:5px 14px;font-size:12px;font-weight:500;border:1.5px solid var(--border2);border-radius:20px;background:var(--white);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.fb:hover{border-color:var(--blue);color:var(--blue)}
.fb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.fb.virt{border-style:dashed}
.fb.virt.on{background:#6b7280;border-color:#6b7280;color:#fff}
.fb.gender.on{background:var(--mint);border-color:var(--mint)}
.fb.grade.on{background:var(--gold);border-color:var(--gold)}
.searchbox{margin-left:auto;padding:6px 14px;font-size:12px;border:1.5px solid var(--border2);border-radius:20px;font-family:inherit;width:200px;outline:none}
.searchbox:focus{border-color:var(--blue)}
.fbar-last{margin-bottom:14px}
.resetbtn{padding:5px 12px;font-size:11px;font-weight:500;border:1px solid var(--border2);border-radius:20px;background:#f8f9fb;color:var(--text3);cursor:pointer;font-family:inherit}
.resetbtn:hover{color:var(--red);border-color:var(--red)}
.divider{height:1px;background:var(--border);margin:2px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.parthead{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:8px 0 -4px;padding:0}
.parthead:first-child{margin-top:0}
.parthead .ph-name{font-size:13.5px;font-weight:700;color:var(--text);white-space:nowrap;letter-spacing:-.3px}
.parthead .ph-cnt{font-size:11px;font-weight:600;color:var(--blue);background:#eef4ff;padding:2px 9px;border-radius:10px;white-space:nowrap}
.parthead .ph-line{flex:1;height:1px;background:var(--border);min-width:20px}
.card{position:relative;background:var(--white);border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:center;cursor:default;transition:box-shadow .18s,border-color .18s;overflow:visible}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1),0 2px 6px rgba(0,0,0,.06);border-color:var(--blue)}
.card.hide{display:none}
.photo{position:relative;width:76px;height:76px;border-radius:14px;overflow:hidden;flex-shrink:0;background:#e8eaed;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--text3);font-weight:700}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.info{flex:1;min-width:0}
.name-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.name{font-size:19px;font-weight:700}
.gdot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0;transform:translateY(-3px);cursor:help}
.g-m{background:#85B7EB}
.g-f{background:#ED93B1}
.notemark{font-size:13px;color:#b4b2a9;cursor:help;line-height:1;transform:translateY(-1px);transition:color .15s}
.notemark:hover{color:var(--text2)}
.pos{font-size:14px;color:var(--blue);font-weight:600}
.dept{font-size:13px;color:var(--text2);line-height:1.45}
.dept-long{font-size:11.8px;letter-spacing:-.45px;line-height:1.4}
.quickinfo{display:flex;flex-direction:column;gap:3px;margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
.qi{font-size:12.5px;color:var(--text);display:flex;gap:7px;align-items:baseline;line-height:1.35}
.qk{font-size:10.5px;color:var(--text3);font-weight:600;min-width:26px;flex-shrink:0}
.qsub{font-size:11px;color:var(--text3);margin-left:2px}
/* 생년월일 표시 토글: 숨기려면 아래를 display:none 으로 */
.qi-birth{display:flex}
.blank{color:#c4c8d4}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px}
.b-active{background:#e6f9f2;color:var(--green)}
.b-leave{background:#fef3e6;color:var(--gold)}
.b-quit{background:#fde8e8;color:var(--red)}
.tag-v{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;background:#eef0f2;color:#6b7280}
/* hover 상세 오버레이 */
.detail{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:50;background:#0F172A;color:#E2E8F0;border-radius:12px;padding:14px 16px;box-shadow:0 8px 28px rgba(15,23,42,.28);opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .16s,transform .16s,visibility .16s;pointer-events:none}
.card:hover .detail{opacity:1;visibility:visible;transform:translateY(0)}
.detail::before{content:"";position:absolute;top:-6px;left:32px;width:12px;height:12px;background:#0F172A;transform:rotate(45deg)}
.detail-hd{font-size:13px;font-weight:700;color:#fff;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid #1e293b}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12px}
.dk{color:#94A3B8;white-space:nowrap}
.dv{color:#E2E8F0;word-break:break-all}
.detail .blank{color:#475569}
.tblwrap{background:var(--white);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-top:28px}
.tblwrap h3{font-size:14px;font-weight:700;padding:16px 20px;border-bottom:1px solid var(--border)}
.tblscroll{overflow-x:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:1400px}
th{background:#f8f9fb;color:var(--text2);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;z-index:5}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr.hide{display:none}
tr:hover td{background:#fafbfc}
.td-name{font-weight:600}
.updated{font-size:11px;color:var(--text3);margin-top:16px;text-align:right}
.orgnote{background:#eef4ff;border:1px solid #d6e4ff;border-radius:10px;padding:12px 16px;font-size:11.5px;color:var(--text2);margin-bottom:20px;line-height:1.6}
.orgnote b{color:var(--blue)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:24px}
.tabbtn{padding:10px 20px;font-size:13px;font-weight:600;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;font-family:inherit;transition:all .15s}
.tabbtn:hover{color:var(--text2)}
.tabbtn.on{color:var(--blue);border-bottom-color:var(--blue)}
.panel{display:none}
.panel.on{display:block}
.org-silsub{font-size:11px;font-weight:500;opacity:.75;letter-spacing:-.2px}
.orgchart{display:flex;flex-direction:column;align-items:center;gap:0}
.org-ceo{background:#0F172A;color:#fff;padding:14px 36px;border-radius:12px;font-size:15px;font-weight:700;box-shadow:var(--shadow);text-align:center}
.org-ceo .cnt{font-size:11px;font-weight:500;color:#94A3B8;margin-top:4px}
.org-conn{width:2px;height:24px;background:var(--border2)}
.org-level{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;align-items:flex-start}
.org-sil{display:flex;flex-direction:column;align-items:center;min-width:280px;flex:1;max-width:400px}
.org-silbox{background:var(--blue);color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:700;text-align:center;box-shadow:var(--shadow);white-space:nowrap;width:100%}
.org-silbox.direct{background:var(--purple)}
.org-silbox .cnt{font-size:10.5px;font-weight:500;opacity:.85;margin-top:1px}
.org-teams{display:flex;flex-direction:column;gap:12px;margin-top:20px;width:100%}
.org-team{background:var(--white);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.org-teamhdr{background:#f8f9fb;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.org-teamhdr .tcnt{font-size:11px;font-weight:600;color:var(--blue);background:#eef4ff;padding:1px 8px;border-radius:10px}
.org-members{padding:6px 14px 10px}
.org-mem{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px dashed var(--border)}
.org-mem:last-child{border-bottom:none}
.org-mem .mname{font-weight:600;color:var(--text)}
.org-mem .mpos{font-size:11px;color:var(--blue);font-weight:600}
.org-part{font-size:10px;color:var(--text3);margin-left:6px;font-weight:500}
.org-partgrp{padding:2px 0}
.org-partgrp.sep{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.org-parthdr{font-size:10.5px;font-weight:700;color:var(--blue);letter-spacing:-.2px;padding:2px 0 4px;display:flex;align-items:center;gap:6px}
.org-parthdr .pcnt{font-size:9.5px;font-weight:600;color:var(--text3);background:#f1f3f6;padding:0 6px;border-radius:8px;line-height:15px}
.org-empty{font-size:11px;color:var(--text3);padding:6px 0;font-style:italic}
/* ===== 현황 대시보드 ===== */
.sec{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.sec-t{font-size:13.5px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec-s{font-size:11px;color:var(--text3);margin-bottom:14px}
.sgrid{display:grid;gap:16px;margin-bottom:16px}
.sgrid.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.sgrid.c3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .n{font-size:21px;font-weight:800;letter-spacing:-.5px}
.kpi .u{font-size:12px;font-weight:600;color:var(--text3);margin-left:2px}
.kpi .l{font-size:11px;color:var(--text3);margin-top:3px}
.kpi .d{font-size:10px;color:var(--text3);margin-top:2px;opacity:.75}
.kpi.hl .n{color:var(--blue)}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{width:132px;height:132px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.donut::after{content:'';position:absolute;inset:26px;background:var(--white);border-radius:50%}
.donut .dc{position:relative;z-index:1;text-align:center}
.donut .dc b{font-size:19px;font-weight:800;display:block;line-height:1.1}
.donut .dc span{font-size:10px;color:var(--text3)}
.leg{display:flex;flex-direction:column;gap:9px;flex:1;min-width:140px}
.leg-i{display:flex;align-items:center;gap:8px;font-size:12px}
.leg-i .sw{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.leg-i .nm{color:var(--text2);min-width:56px}
.leg-i .vl{margin-left:auto;font-weight:700}
.leg-i .pc{color:var(--text3);font-size:11px;width:44px;text-align:right}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-r{display:flex;align-items:center;gap:10px;font-size:12px}
.bar-r .bl{min-width:104px;color:var(--text2);text-align:right;flex-shrink:0;font-weight:500}
.bar-r .bt{flex:1;height:20px;background:#f1f3f6;border-radius:5px;overflow:hidden;display:flex;min-width:40px}
.bar-r .bw{height:100%;display:flex;min-width:0;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-r .bw .bf{border-radius:0}
.bar-r .bw .bf:first-child{border-radius:5px 0 0 5px}
.bar-r .bw .bf:last-child{border-radius:0 5px 5px 0}
.bar-r .bt>.bw:only-child>.bf:only-child{border-radius:5px}
.bar-r .bt[data-tip]{cursor:pointer}
.tip{position:fixed;z-index:9999;display:none;max-width:320px;background:#1a1d23;color:#fff;border-radius:9px;padding:10px 12px;font-size:11.5px;line-height:1.65;box-shadow:0 6px 24px rgba(0,0,0,.28);pointer-events:none;letter-spacing:-.1px}
.tip b{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#fff}
.tip .tnames{color:#cbd0d8;word-break:keep-all}
.tip.pin{pointer-events:auto;box-shadow:0 0 0 2px var(--blue),0 6px 24px rgba(0,0,0,.28)}
.tip .tpin{display:none;margin-top:7px;padding-top:6px;border-top:1px solid #343845;color:#8b90a0;font-size:10px}
.tip.pin .tpin{display:block}
.bar-r .bf{height:100%;border-radius:5px 0 0 5px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar-r .bf:last-child{border-radius:5px}
.bar-r .bv{min-width:56px;text-align:right;font-weight:700;flex-shrink:0}
.bar-r .bv small{font-weight:500;color:var(--text3);margin-left:3px;font-size:10.5px}
.bar-r.acc .bl{color:var(--blue);font-weight:700}
.cols{display:flex;align-items:stretch;gap:8px;height:178px;padding:8px 0 2px}
.col-i{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;gap:5px;min-width:0}
.col-tr{flex:1;width:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center}
.col-b{width:100%;max-width:44px;background:linear-gradient(180deg,#6f9bf7,#4b7cf3);border-radius:5px 5px 0 0;min-height:3px;transition:height .5s;position:relative;cursor:pointer}
.col-b.z{cursor:default}
.col-b.z{background:#e4e7ec}
.col-v{font-size:11px;font-weight:700;height:14px;line-height:14px;flex-shrink:0}
.col-l{font-size:10px;color:var(--text3);white-space:nowrap;flex-shrink:0;line-height:14px;height:14px}
.xt{width:100%;border-collapse:collapse;font-size:12px}
.xt th,.xt td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.xt th{background:#f8f9fb;color:var(--text3);font-size:11px;font-weight:600}
.xt th:first-child,.xt td:first-child{text-align:left;font-weight:600}
.xt td.z{color:#d5d8de}
.xt tr.tot td{background:#f8f9fb;font-weight:700;border-bottom:none}
.xt td.hi{color:var(--blue);font-weight:700}
.tw{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:#f4f6fa;border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:11.5px;display:flex;align-items:center;gap:7px}
.chip b{font-weight:700}
.chip .cs{font-size:10px;color:var(--text3)}
.chip.new{background:#eef4ff;border-color:#c7d9ff}
.note{font-size:10.5px;color:var(--text3);margin-top:11px;line-height:1.6;padding-top:10px;border-top:1px dashed var(--border)}
.tg{display:inline-flex;gap:0;border:1px solid var(--border2);border-radius:16px;overflow:hidden;margin-left:auto}
.tg button{padding:3px 11px;font-size:11px;border:0;background:var(--white);color:var(--text3);cursor:pointer;font-family:inherit;font-weight:500}
.tg button.on{background:var(--blue);color:#fff}
@media(max-width:640px){.bar-r .bl{min-width:76px;font-size:11px}.kpis{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}}

/* ===== 잠금 화면 ===== */
#lockbox{position:fixed;inset:0;background:#0F172A;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:#fff;border-radius:18px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.lock-ico{font-size:36px;margin-bottom:14px;line-height:1}
.lock-t{font-size:19px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
.lock-s{font-size:12px;color:var(--text3);line-height:1.7;margin-bottom:24px}
.lock-in{width:100%;padding:12px 14px;font-size:14px;font-family:inherit;border:1.5px solid var(--border2);border-radius:10px;outline:none;text-align:center;letter-spacing:2px}
.lock-in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(75,124,243,.12)}
.lock-btn{width:100%;margin-top:10px;padding:12px;font-size:13.5px;font-weight:700;font-family:inherit;background:#2563EB;color:#fff;border:0;border-radius:10px;cursor:pointer;transition:background .15s}
.lock-btn:hover:not(:disabled){background:#1d4ed8}
.lock-btn:disabled{background:#94a3b8;cursor:wait}
.lock-err{font-size:11.5px;color:var(--red);margin-top:12px;min-height:16px;font-weight:600}
.lock-note{font-size:10px;color:#b0b5c2;line-height:1.7;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}
#vault:empty{min-height:60vh}

</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-left"><a href="index.html" class="hdr-logo" title="허브로 이동">S</a><div class="logo">에스씨지랩 임직원 명부</div></div>
  <div class="hdr-meta">기준일 <b>2026.06.30</b></div>
</div>
<div class="wrap">
  <div id="lockbox">
    <div class="lock-card">
      <div class="lock-ico">🔒</div>
      <div class="lock-t">임직원 명부</div>
      <div class="lock-s">개인정보가 포함된 문서입니다.<br>열람 권한이 있는 담당자만 접근할 수 있습니다.</div>
      <input type="password" id="lock-pw" class="lock-in" placeholder="비밀번호" autocomplete="off" autofocus>
      <button class="lock-btn" id="lock-go">열람하기</button>
      <div class="lock-err" id="lock-err"></div>
      <div class="lock-note">본 문서의 내용은 「개인정보 보호법」에 따라 보호됩니다.<br>무단 열람·복제·외부 반출을 금합니다.</div>
    </div>

<script>
(function(){
  const B=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const P=JSON.parse(document.getElementById('sealed').textContent);
  const box=document.getElementById('lockbox'), vault=document.getElementById('vault');
  const inp=document.getElementById('lock-pw'), btn=document.getElementById('lock-go'), err=document.getElementById('lock-err');
  let busy=false;

  async function unseal(pw){
    const ks=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:B(P.s),iterations:P.n,hash:'SHA-256'},ks,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:B(P.i)},key,B(P.c));
    return new TextDecoder().decode(pt);
  }
  function open_(html){
    vault.innerHTML=html;
    box.remove();
    document.getElementById('sealed').remove();
    if(typeof applyAll==='function') applyAll();
  }
  async function tryPw(pw,silent){
    if(busy||!pw) return false;
    busy=true; btn.textContent='해독 중…'; btn.disabled=true; err.textContent='';
    try{
      const html=await unseal(pw);
      sessionStorage.setItem('scg_k',pw);
      open_(html); return true;
    }catch(e){
      sessionStorage.removeItem('scg_k');
      if(!silent){ err.textContent='비밀번호가 올바르지 않습니다.'; inp.value=''; inp.focus(); }
      btn.textContent='열람하기'; btn.disabled=false; busy=false; return false;
    }
  }
  btn.onclick=()=>tryPw(inp.value,false);
  inp.onkeydown=e=>{ if(e.key==='Enter') tryPw(inp.value,false); };
  const saved=sessionStorage.getItem('scg_k');
  if(saved) tryPw(saved,true).then(ok=>{ if(!ok){ btn.textContent='열람하기'; btn.disabled=false; busy=false; inp.focus(); } });
})();
</script>

<script>
const CEO_LABEL="대표이사";
let curDept={val:'all',type:'all'}, curGender='all', curGrade='all';

function showTab(btn,id){
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if(id==='panel-org') buildOrg();
  if(id==='panel-stat') buildStat();
}
function setDept(btn,type){
  // 이미 켜진 버튼(전체 아님) 재클릭 → 전체로 복귀
  if(btn.classList.contains('on') && btn.getAttribute('data-dfilter')!=='all'){
    document.querySelectorAll('.dept-f').forEach(b=>b.classList.remove('on'));
    document.querySelector('.dept-f[data-dfilter="all"]').classList.add('on');
    curDept={val:'all',type:'all'}; applyAll(); return;
  }
  document.querySelectorAll('.dept-f').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  curDept={val:btn.getAttribute('data-dfilter'),type:type};
  applyAll();
}
function setGender(btn){
  if(btn.classList.contains('on') && btn.getAttribute('data-sfilter')!=='all'){
    document.querySelectorAll('.gender').forEach(b=>b.classList.remove('on'));
    document.querySelector('.gender[data-sfilter="all"]').classList.add('on');
    curGender='all'; applyAll(); return;
  }
  document.querySelectorAll('.gender').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  curGender=btn.getAttribute('data-sfilter');
  applyAll();
}
function setGrade(btn){
  if(btn.classList.contains('on') && btn.getAttribute('data-gfilter')!=='all'){
    document.querySelectorAll('.grade').forEach(b=>b.classList.remove('on'));
    document.querySelector('.grade[data-gfilter="all"]').classList.add('on');
    curGrade='all'; applyAll(); return;
  }
  document.querySelectorAll('.grade').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  curGrade=btn.getAttribute('data-gfilter');
  applyAll();
}
function resetAll(){
  curDept={val:'all',type:'all'}; curGender='all'; curGrade='all';
  document.querySelectorAll('.dept-f,.gender,.grade').forEach(b=>b.classList.remove('on'));
  document.querySelector('.dept-f[data-dfilter="all"]').classList.add('on');
  document.querySelector('.gender[data-sfilter="all"]').classList.add('on');
  document.querySelector('.grade[data-gfilter="all"]').classList.add('on');
  document.getElementById('search').value='';
  applyAll();
}
function matchDept(el){
  if(curDept.val==='all') return true;
  if(curDept.type==='dept') return el.getAttribute('data-dept')===curDept.val;
  if(curDept.type==='team') return el.getAttribute('data-team')===curDept.val;
  if(curDept.type==='virt') return (el.getAttribute('data-virt')||'').includes(curDept.val);
  return true;
}
function applyAll(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const test=(el)=> matchDept(el)
    && (curGender==='all' || el.getAttribute('data-gender')===curGender)
    && (curGrade==='all' || el.getAttribute('data-grade')===curGrade)
    && (!q || (el.getAttribute('data-name')||'').toLowerCase().includes(q));

function renderPartHeads(){
  document.querySelectorAll('.parthead').forEach(h=>h.remove());
  let keyAttr;
  if(curDept.val==='all') keyAttr='data-dept';
  else if(curDept.type==='dept') keyAttr='data-team';
  else keyAttr='data-part';
  const grid=document.getElementById('cardgrid');
  const shown=[...grid.querySelectorAll('.card')].filter(c=>!c.classList.contains('hide'));
  if(shown.length<2) return;
  const keys=shown.map(c=>c.getAttribute(keyAttr)||'');
  if(new Set(keys).size<2) return;
  let prev=null;
  shown.forEach(c=>{
    const k=c.getAttribute(keyAttr)||'';
    if(k!==prev){
      const cnt=shown.filter(x=>(x.getAttribute(keyAttr)||'')===k).length;
      let label=k;
      if(!label){
        if(keyAttr==='data-part') label=(c.getAttribute('data-team')||'파트 미지정');
        else if(keyAttr==='data-team') label=(c.getAttribute('data-dept')||'')+' 직속';
        else label='대표이사';

      const h=document.createElement('div');
      h.className='parthead';
      h.innerHTML=`<span class="ph-name">${label}</span><span class="ph-cnt">${cnt}명</span><span class="ph-line"></span>`;
      grid.insertBefore(h,c);
      prev=k;
    }
  });
}

function getMembers(){

const POSB={"대표이사":0,"실장":1,"팀장":2,"파트장":3,"팀원":5,"파트원":5};
const GRD={"대표이사":0,"이사":1,"부장":2,"차장":3,"과장":4,"대리":5,"선임":6,"사원":7};
function rankM(m){ return (m.pos&&POSB[m.pos]!==undefined?POSB[m.pos]:6)*100 + (GRD[m.grade]??9); }
function sortM(a,b){ return rankM(a)-rankM(b) || (a.idx-b.idx); }
function lbl(m){ return m.grade || m.pos; }
function posTag(m){ return (m.pos && m.pos!=='파트원' && m.pos!=='팀원') ? m.pos : ''; }
const PARTORD={"기획파트":0,"마케팅파트":1,"디자인파트":0,"서버1파트":0,"서버2파트":1,"서버3파트":2,"프론트엔드파트":3,"빌링파트":4};

  let html=`<div class="org-ceo">대표이사<div style="margin-top:6px;font-size:14px">${ceoHtml||CEO_LABEL}</div><div class="cnt">전체 ${mem.length}명</div></div><div class="org-conn"></div><div class="org-level">`;
  ORG.forEach(u=>{
    const um=mem.filter(m=>m.sil===u.sil && !m.isCEO);

      html+=`<div class="org-team"><div class="org-teamhdr">실 직속<span class="tcnt">${direct.length}명</span></div><div class="org-members">`;

      if(!tm.length){ html+=`<div class="org-empty">배정 인원 없음</div>`; }
      else {
        // 파트별 그룹핑 (파트 없으면 팀 직속)
        const noPart=tm.filter(m=>!m.part).sort(sortM);
        const parts=[...new Set(tm.filter(m=>m.part).map(m=>m.part))]
          .sort((a,b)=>(PARTORD[a]??9)-(PARTORD[b]??9));
        if(noPart.length && !parts.length){
          noPart.forEach(m=>html+=row(m));
        } else {

function row(m,inPart){

/* ================= 현황 대시보드 ================= */
const C_M='#85B7EB', C_F='#ED93B1', C_N='#cbd0d8';
const PAL=['#4b7cf3','#1ec997','#d97706','#7c3aed','#ef4444','#0ea5e9','#84cc16','#f43f5e','#64748b','#a855f7'];
const GORD=["대표이사","이사","부장","차장","과장","대리","선임","사원"];
const PORD=["대표이사","실장","팀장","파트장","팀원","파트원"];
const NOW_Y=2026, NOW_M=7;
let tenBase='c';

function statRows(){
  return [...document.querySelectorAll('#rostertable tbody tr')].map(r=>{
    const td=r.querySelectorAll('td');
    const t=i=>{const v=(td[i]?td[i].textContent:'').trim(); return v==='-'?'':v;};
    const b=r.querySelector('.badge');
    const pd=str=>{const m=str.match(/(\d{4})-(\d{2})-(\d{2})/); return m?{y:+m[1],m:+m[2]}:null;};
    const pt=str=>{const m=str.match(/(\d+)\s*년\s*(\d+)\s*개월/); return m?(+m[1]*12 + +m[2]):null;};
    const tp=t(5).split('·');
    const by=(t(3).match(/^(\d{4})/)||[])[1];
    return {
      name:t(1), gender:t(2)||'', birth: by?+by:null,
      sil:(r.getAttribute('data-dept')||'').trim(),
      team:(tp[0]||'').trim(), part:(tp[1]||'').trim(),
      grade:t(6)||'', pos:t(7)||'',
      gjoin:pd(t(8)), cjoin:pd(t(9)),
      gten:pt(t(8)), cten:pt(t(9)),
      route:t(14)||'', memo:t(16)||'',
      virt:(r.getAttribute('data-virt')||'').trim(),
      status: b&&b.classList.contains('b-leave')?'휴직':(b&&b.classList.contains('b-quit')?'퇴사':'재직')
    };

const pct=(a,b)=> b? Math.round(a/b*1000)/10 : 0;
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function tipAttr(head,names){
  const body = names&&names.length ? `<span class="tnames">${names.join(' · ')}</span>` : '';
  return ` data-tip="${esc(`<b>${head}</b>${body}<span class="tpin">클릭하면 고정 해제</span>`)}"`;
}
(function initTip(){
  const tip=document.createElement('div'); tip.className='tip'; document.body.appendChild(tip);
  let pin=false;
  const place=(x,y)=>{const r=tip.getBoundingClientRect();
    let l=x+14, t=y+16;
    if(l+r.width>innerWidth-8) l=Math.max(8,x-r.width-14);
    if(t+r.height>innerHeight-8) t=Math.max(8,y-r.height-14);
    tip.style.left=l+'px'; tip.style.top=t+'px';};
  const show=(el,x,y)=>{tip.innerHTML=el.getAttribute('data-tip'); tip.style.display='block'; place(x,y);};
  const hide=()=>{tip.style.display='none'; tip.classList.remove('pin'); pin=false;};
  document.addEventListener('mousemove',e=>{
    if(pin) return;
    const el=e.target.closest&&e.target.closest('[data-tip]');
    if(el){ if(tip.style.display!=='block'||tip.dataset.k!==el.getAttribute('data-tip')){tip.dataset.k=el.getAttribute('data-tip'); show(el,e.clientX,e.clientY);} else place(e.clientX,e.clientY); }
    else { tip.style.display='none'; }
  });
  document.addEventListener('click',e=>{
    const el=e.target.closest&&e.target.closest('[data-tip]');
    if(el){ if(pin){hide();} else {pin=true; tip.dataset.k=el.getAttribute('data-tip'); show(el,e.clientX,e.clientY); tip.classList.add('pin');} e.stopPropagation(); }
    else if(pin) hide();
  },true);
  window.addEventListener('scroll',()=>{if(!pin) tip.style.display='none';},true);
})();
const yrs=mo=> mo==null?'-':(Math.round(mo/12*10)/10)+'년';
function bar(label,val,total,color,extra){
  const w=total?val/total*100:0;
  const tp=(extra&&extra.names)?tipAttr(`${label} · ${val}명 (${pct(val,total)}%)`,extra.names):'';
  return `<div class="bar-r${extra&&extra.acc?' acc':''}"><div class="bl">${label}</div><div class="bt"${tp}><div class="bf" style="width:${w}%;background:${color}"></div></div><div class="bv">${val}<small>${pct(val,total)}%</small></div></div>`;
}
function barStack(label,segs,total,max,names){
  const sum=segs.reduce((a,s)=>a+s.v,0);
  const w=max?sum/max*100:0;
  const on=segs.filter(s=>s.v>0);
  const inner=on.map(s=>`<div class="bf" style="width:${sum?s.v/sum*100:0}%;background:${s.c}"></div>`).join('');
  const head=`${label} · ${sum}명 (${pct(sum,total)}%) — ${on.map(s=>`${s.n} ${s.v}`).join(' / ')}`;
  const tp=tipAttr(head,names||[]);
  return `<div class="bar-r"><div class="bl">${label}</div><div class="bt"${tp}><div class="bw" style="width:${w}%">${inner}</div></div><div class="bv">${sum}<small>${pct(sum,total)}%</small></div></div>`;
}
function donut(el,dc,leg,items,centerNum,centerLbl){
  const tot=items.reduce((a,i)=>a+i.v,0);
  let acc=0, seg=[];
  items.forEach(i=>{const st=acc/tot*360; acc+=i.v; seg.push(`${i.c} ${st}deg ${acc/tot*360}deg`);});
  document.getElementById(el).style.background=`conic-gradient(${seg.join(',')})`;
  document.getElementById(dc).innerHTML=`<b>${centerNum}</b><span>${centerLbl}</span>`;
  document.getElementById(leg).innerHTML=items.map(i=>
    `<div class="leg-i"><span class="sw" style="background:${i.c}"></span><span class="nm">${i.n}</span><span class="vl">${i.v}명</span><span class="pc">${pct(i.v,tot)}%</span></div>`).join('');
}
function normRoute(r){
  if(!r) return '기타';
  if(/^지원/.test(r)) return '공개지원';
  if(/대표이사 추천/.test(r)) return '대표이사 추천';
  if(/직원 추천|^추천$/.test(r)) return '직원 추천(리퍼럴)';
  if(/인재서칭/.test(r)) return '인재서칭(내부HR)';
  if(/채용플랫폼|헤드헌팅/.test(r)) return '헤드헌팅 및 유료채용';
  if(/합병|전입/.test(r)) return '합병·전입';
  if(/현장실습/.test(r)) return '현장실습 전환';
  return '기타';
}
const TB=[[0,11,'1년 미만'],[12,35,'1년 ~ 3년 미만'],[36,59,'3년 ~ 5년 미만'],[60,83,'5년 ~ 7년 미만'],[84,119,'7년 ~ 10년 미만'],[120,9999,'10년 이상']];

function drawTen(M){

  const cnt=TB.map(([a,b,l])=>({l,ns:has.filter(m=>m[key]>=a&&m[key]<=b).map(m=>m.name)}));
  const tot=has.length;
  document.getElementById('k-ten').innerHTML=cnt.map((c,i)=>bar(c.l,c.ns.length,tot,PAL[i],{names:c.ns})).join('');
  cnt.forEach(c=>c.v=c.ns.length);
  const avg=tot?has.reduce((a,m)=>a+m[key],0)/tot:0;
  const md=[...has.map(m=>m[key])].sort((a,b)=>a-b);
  const med=tot?(tot%2?md[(tot-1)/2]:(md[tot/2-1]+md[tot/2])/2):0;
  document.getElementById('k-tensub').textContent = (tenBase==='c'?'에스씨지랩 입사일':'KAIPER 그룹 최초 입사일')+' 기준 · 모수 '+tot+'명'+(miss?' (입사일 미기재 '+miss+'명 제외)':'');
  const u1=cnt[0].v, o10=cnt[5].v;
  document.getElementById('k-tennote').innerHTML=
    `평균 근속 <b>${yrs(avg)}</b> · 중위 근속 <b>${yrs(med)}</b> · 1년 미만 <b>${u1}명(${pct(u1,tot)}%)</b> · 10년 이상 <b>${o10}명(${pct(o10,tot)}%)</b>` +

}
function buildStat(){
  const M=statRows();
  const T=M.length, act=M.filter(m=>m.status==='재직').length, lv=M.filter(m=>m.status==='휴직').length;
  const f=M.filter(m=>m.gender==='여').length, mm=M.filter(m=>m.gender==='남').length;
  const cT=M.filter(m=>m.cten!=null), avgC=cT.reduce((a,m)=>a+m.cten,0)/(cT.length||1);
  const gT=M.filter(m=>m.gten!=null), avgG=gT.reduce((a,m)=>a+m.gten,0)/(gT.length||1);
  const ag=M.filter(m=>m.birth), avgA=ag.reduce((a,m)=>a+(NOW_Y-m.birth),0)/(ag.length||1);
  const mgr=M.filter(m=>['대표이사','실장','팀장','파트장'].includes(m.pos)).length;
  const u1=cT.filter(m=>m.cten<12).length;

  /* KPI */
  document.getElementById('k-kpis').innerHTML=[
    ['총 인원',T,'명','재직 '+act+' · 휴직 '+lv,1],
    ['여성 비율',pct(f,T),'%','여 '+f+' · 남 '+mm,0],
    ['평균 근속(회사)',Math.round(avgC/12*10)/10,'년','중앙값 포함 '+cT.length+'명',0],
    ['평균 근속(그룹)',Math.round(avgG/12*10)/10,'년',gT.length+'명 기준',0],
    ['평균 연령',Math.round(avgA*10)/10,'세',ag.length+'명 기준(2명 미기재)',0],
    ['관리자 수',mgr,'명','1인당 '+(Math.round((T-mgr)/mgr*10)/10)+'명 관리',0],
    ['신규(1년 미만)',u1,'명','전체의 '+pct(u1,cT.length)+'%',0],
    ['휴직·특이사항',M.filter(m=>m.status==='휴직'||m.memo).length,'명','근태 관리 대상',0],
  ].map(([l,n,u,d,h])=>`<div class="kpi${h?' hl':''}"><div class="n">${n}<span class="u">${u}</span></div><div class="l">${l}</div><div class="d">${d}</div></div>`).join('');

  /* 성별 도넛 */
  const gi=[{n:'남성',v:mm,c:C_M},{n:'여성',v:f,c:C_F}];
  if(T-mm-f>0) gi.push({n:'미기재',v:T-mm-f,c:C_N});
  donut('k-gdonut','k-gdc','k-gleg',gi,T+'명','전체');

  /* 직위 도넛 */
  const pg=[{n:'대표이사',v:M.filter(m=>m.pos==='대표이사').length,c:'#1a1d23'},
            {n:'실장',v:M.filter(m=>m.pos==='실장').length,c:'#4b7cf3'},
            {n:'팀장',v:M.filter(m=>m.pos==='팀장').length,c:'#1ec997'},
            {n:'파트장',v:M.filter(m=>m.pos==='파트장').length,c:'#d97706'},
            {n:'팀원·파트원',v:M.filter(m=>m.pos==='팀원'||m.pos==='파트원').length,c:'#cbd0d8'},
            {n:'보직 없음',v:M.filter(m=>!m.pos).length,c:'#eef0f3'}].filter(x=>x.v>0);
  donut('k-pdonut','k-pdc','k-pleg',pg,pct(mgr,T)+'%','관리자 비중');

  /* 직급 */
  const grs=GORD.filter(g=>M.some(m=>m.grade===g));
  const noG=M.filter(m=>!m.grade).length;
  const gmax=Math.max(...grs.map(g=>M.filter(m=>m.grade===g).length), noG);
  let gh=grs.map(g=>{const gm=M.filter(m=>m.grade===g);
    return barStack(g,[{n:'남',v:gm.filter(x=>x.gender==='남').length,c:C_M},{n:'여',v:gm.filter(x=>x.gender==='여').length,c:C_F},{n:'미기재',v:gm.filter(x=>!x.gender).length,c:C_N}],T,gmax,gm.map(x=>x.name));}).join('');
  if(noG) gh+=barStack('직급 미기재',[{n:'미기재',v:noG,c:C_N}],T,gmax,M.filter(m=>!m.grade).map(x=>x.name));
  document.getElementById('k-grade').innerHTML=gh;
  const snr=M.filter(m=>['대표이사','이사','부장'].includes(m.grade)).length;
  document.getElementById('k-gradenote').innerHTML=
    `<span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${C_M}"></span> 남 &nbsp; <span class="sw" style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${C_F}"></span> 여<br>
     부장 이상(임원 포함) <b>${snr}명 (${pct(snr,T)}%)</b> · 과장 이하 실무진 <b>${T-snr-noG}명</b>. 상위 직급 비중이 30%를 넘으면 승진 정체·인건비 압박 신호로 봅니다.`;

  drawTen(M);

  /* 연령대 */
  const AB=[[0,29,'20대 이하'],[30,39,'30대'],[40,49,'40대'],[50,99,'50대 이상']];
  const amax=M.length;
  document.getElementById('k-age').innerHTML=AB.map(([a,b,l],i)=>{
    const am=ag.filter(m=>{const x=NOW_Y-m.birth; return x>=a&&x<=b;});
    return barStack(l,[{n:'남',v:am.filter(x=>x.gender==='남').length,c:C_M},{n:'여',v:am.filter(x=>x.gender==='여').length,c:C_F}],ag.length,Math.max(...AB.map(([p,q])=>ag.filter(m=>{const x=NOW_Y-m.birth;return x>=p&&x<=q;}).length)),am.map(x=>`${x.name}(${NOW_Y-x.birth})`));
  }).join('');
  const ages=ag.map(m=>NOW_Y-m.birth).sort((a,b)=>a-b);
  document.getElementById('k-agenote').innerHTML=`최연소 <b>${ages[0]}세</b> · 최연장 <b>${ages[ages.length-1]}세</b> · 평균 <b>${Math.round(avgA*10)/10}세</b> (출생연도 미기재 ${T-ag.length}명 제외)`;

  /* 채용경로 */
  const rc={}; M.forEach(m=>{const k=normRoute(m.route); (rc[k]=rc[k]||[]).push(m.name);});
  const re=Object.entries(rc).sort((a,b)=>b[1].length-a[1].length);
  document.getElementById('k-route').innerHTML=re.map(([k,ns],i)=>
    bar(k,ns.length,T,PAL[i%PAL.length],{acc:i===0,names:ns})).join('');

  /* 조직별 */
  const avg=(arr,k)=>{const a=arr.filter(x=>x[k]!=null); return a.length?Math.round(a.reduce((s,x)=>s+x[k],0)/a.length/12*10)/10:'-';};
  const avgAge=arr=>{const a=arr.filter(x=>x.birth); return a.length?Math.round(a.reduce((s,x)=>s+(NOW_Y-x.birth),0)/a.length*10)/10:'-';};
  let oh='<thead><tr><th>조직</th><th>인원</th><th>남</th><th>여</th><th>여성비</th><th>평균 근속(회사)</th><th>평균 연령</th></tr></thead><tbody>';
  const row=(nm,arr,lvl)=>{
    const pad=lvl===1?'&nbsp;&nbsp;└ ':(lvl===2?'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;· ':'');
    const mn=arr.filter(x=>x.gender==='남').length, fn=arr.filter(x=>x.gender==='여').length;
    return `<tr><td style="${lvl?'font-weight:500;color:var(--text2)':''}">${pad}${nm}</td><td${lvl?'':' class="hi"'}>${arr.length}</td><td class="${mn?'':'z'}">${mn||'-'}</td><td class="${fn?'':'z'}">${fn||'-'}</td><td>${pct(fn,arr.length)}%</td><td>${avg(arr,'cten')}년</td><td>${avgAge(arr)}세</td></tr>`;
  };
  const ceo=M.filter(m=>!m.sil); if(ceo.length) oh+=row('대표이사',ceo,0);
  ORG.forEach(u=>{
    const um=M.filter(m=>m.sil===u.sil); if(!um.length) return;
    oh+=row(u.sil,um,0);
    const dir=um.filter(m=>!m.team); if(dir.length) oh+=row('실 직속',dir,1);
    u.teams.forEach(t=>{
      const tm=um.filter(m=>m.team===t); if(!tm.length) return;
      oh+=row(t,tm,1);
      [...new Set(tm.filter(m=>m.part).map(m=>m.part))].sort((a,b)=>(PARTORD[a]??9)-(PARTORD[b]??9))
        .forEach(p=>oh+=row(p,tm.filter(m=>m.part===p),2));
    });
  });
  const vb=M.filter(m=>m.virt==='빌링사업부');
  oh+=`<tr class="tot"><td>합계</td><td>${T}</td><td>${mm}</td><td>${f}</td><td>${pct(f,T)}%</td><td>${avg(M,'cten')}년</td><td>${avgAge(M)}세</td></tr>`;
  if(vb.length) oh+=`<tr><td colspan="7" style="text-align:left;color:var(--purple);font-size:11px;background:#faf8ff;font-weight:600">[가상 그룹] 빌링사업부 (호칭) — ${vb.length}명 · 남 ${vb.filter(x=>x.gender==='남').length} / 여 ${vb.filter(x=>x.gender==='여').length} · 평균 근속(회사) ${avg(vb,'cten')}년 · 평균 연령 ${avgAge(vb)}세</td></tr>`;
  document.getElementById('k-org').innerHTML=oh+'</tbody>';

  /* 성별 × 직급 */
  let ch='<thead><tr><th>직급</th><th>남</th><th>여</th><th>합계</th><th>여성 비중</th></tr></thead><tbody>';
  grs.forEach(g=>{const gm=M.filter(m=>m.grade===g), a=gm.filter(x=>x.gender==='남').length, b=gm.filter(x=>x.gender==='여').length;
    ch+=`<tr><td>${g}</td><td class="${a?'':'z'}">${a||'-'}</td><td class="${b?'':'z'}">${b||'-'}</td><td>${gm.length}</td><td${b/gm.length>=.5?' class="hi"':''}>${pct(b,gm.length)}%</td></tr>`;});
  if(noG){const gm=M.filter(m=>!m.grade); ch+=`<tr><td>미기재</td><td class="z">-</td><td>${gm.filter(x=>x.gender==='여').length}</td><td>${gm.length}</td><td>${pct(gm.filter(x=>x.gender==='여').length,gm.length)}%</td></tr>`;}
  ch+=`<tr class="tot"><td>합계</td><td>${mm}</td><td>${f}</td><td>${T}</td><td>${pct(f,T)}%</td></tr>`;
  document.getElementById('k-cross').innerHTML=ch+'</tbody>';
  const up=M.filter(m=>['대표이사','이사','부장','차장'].includes(m.grade));
  document.getElementById('k-crossnote').innerHTML=`차장 이상 <b>${up.length}명</b> 중 여성 <b>${up.filter(x=>x.gender==='여').length}명 (${pct(up.filter(x=>x.gender==='여').length,up.length)}%)</b> · 전사 여성 비중 ${pct(f,T)}%. 두 수치의 격차가 크면 상위 직급 성별 편중을 의미합니다.`;

  /* 연도별 입사 */
  const ys=M.filter(m=>m.cjoin).map(m=>m.cjoin.y);
  const y0=Math.min(...ys), y1=Math.max(...ys);
  const yr=[]; for(let y=y0;y<=y1;y++) yr.push([y, ys.filter(x=>x===y).length]);
  const ymax=Math.max(...yr.map(x=>x[1]),1);
  document.getElementById('k-year').innerHTML=yr.map(([y,v])=>{
    const ns=M.filter(m=>m.cjoin&&m.cjoin.y===y).map(m=>m.name);
    const tp=v?tipAttr(`${y}년 입사 · ${v}명`,ns):'';
    return `<div class="col-i"><div class="col-v">${v||''}</div><div class="col-tr"><div class="col-b ${v?'':'z'}" style="height:${v?Math.max(v/ymax*100,4):2}%"${tp}></div></div><div class="col-l">${String(y).slice(2)}년</div></div>`;
  }).join('');
  const peak=yr.slice().sort((a,b)=>b[1]-a[1])[0];
  const y26=ys.filter(x=>x===2026).length;
  document.getElementById('k-yearnote').innerHTML=`잔존 인원이 가장 많은 입사연도는 <b>${peak[0]}년(${peak[1]}명)</b> · 2026년 입사자 <b>${y26}명</b>. 합병(KIB)·전입 인원은 편입 시점이 회사 입사일로 잡혀 특정 연도에 몰려 보일 수 있습니다.`;

  /* 최근 1년 입사자 */
  const mon=d=>d?(d.y*12+d.m):null, nowm=NOW_Y*12+NOW_M;
  const nw=M.filter(m=>m.cjoin && nowm-mon(m.cjoin)<12).sort((a,b)=>mon(b.cjoin)-mon(a.cjoin));
  document.getElementById('k-new').innerHTML= nw.length? nw.map(m=>
    `<div class="chip new"><b>${m.name}</b> <span class="cs">${m.grade||m.pos||''} · ${m.team||m.sil||'대표이사'} · ${m.cjoin.y}.${String(m.cjoin.m).padStart(2,'0')} 입사</span></div>`).join('') : '<div class="cs">해당 없음</div>';

  /* 장기근속 TOP5 */
  const tp=M.filter(m=>m.gten!=null).sort((a,b)=>b.gten-a.gten).slice(0,5);
  document.getElementById('k-top').innerHTML=tp.map((m,i)=>
    `<div class="chip"><b>${i+1}. ${m.name}</b> <span class="cs">${m.grade||''} · ${yrs(m.gten)} (회사 ${yrs(m.cten)})</span></div>`).join('');

  /* 리스크 */
  const rk=M.filter(m=>m.status==='휴직'||m.memo);
  document.getElementById('k-risk').innerHTML= rk.length? rk.map(m=>
    `<div class="chip"><b>${m.name}</b> <span class="cs">${m.team||m.sil||''} · ${m.status==='휴직'?'<span style="color:var(--gold);font-weight:700">휴직</span> · ':''}${m.memo||'-'}</span></div>`).join('') : '<div class="cs">해당 없음</div>';

  document.getElementById('k-foot').textContent=`집계 기준 ${NOW_Y}.${String(NOW_M).padStart(2,'0')} · 총 ${T}명(재직 ${act} / 휴직 ${lv}) · 퇴사자 제외 · 명부 표 데이터에서 자동 산출`;
}

</script>
</body>
</html>
